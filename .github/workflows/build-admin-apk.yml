name: Build Admin APK
on:
  push:
    paths:
      - 'admin/**'
      - 'native/admin_icons.py'
      - '.github/workflows/build-admin-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: admin-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: pip install pillow
      - name: Admin app config (loads https://hiregh.pages.dev/admin/)
        run: |
          mkdir -p admin-shell
          printf '<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>location.replace("https://hiregh.pages.dev/admin/")</script>' > admin-shell/index.html
          cat > admin-shell/offline.html <<'HTML'
          <!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobPaw 管理</title>
          <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#161616;color:#fff;font-family:system-ui,sans-serif;text-align:center}
          button{margin-top:18px;border:0;border-radius:24px;padding:12px 28px;font-size:16px;font-weight:700;background:#C7E65A;color:#161616}</style></head>
          <body><div><div style="font-size:44px">📡</div><h2>网络连接失败</h2><p style="opacity:.7">请检查网络后重试</p><button onclick="location.href='https://hiregh.pages.dev/admin/'">重新加载</button></div></body></html>
          HTML
          printf '{"appId":"com.jobpaw.admin","appName":"JobPaw 管理","webDir":"admin-shell","server":{"url":"https://hiregh.pages.dev/admin/","errorPath":"offline.html","androidScheme":"https"},"android":{"backgroundColor":"#161616"}}\n' > capacitor.config.json
          cat capacitor.config.json
      - run: npx cap add android
      - run: python3 native/admin_icons.py android
      - name: Set app version
        run: |
          echo "VER=1.0.${{ github.run_number }}" >> $GITHUB_ENV
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName|applicationId" android/app/build.gradle
      - name: Fixed signing key (so new versions install over old ones)
        run: |
          base64 -d android-test-signing.b64 > android/app/hiregh-test.keystore
          python3 - <<'PY'
          p='android/app/build.gradle'; s=open(p).read()
          cfg='''android {
              signingConfigs {
                  debug {
                      storeFile file("hiregh-test.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }'''
          s=s.replace('android {',cfg,1); open(p,'w').write(s)
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk JobPaw-Admin.apk
      - name: Check signature
        run: $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs JobPaw-Admin.apk | head -3
      - uses: actions/upload-artifact@v4
        with: { name: JobPaw-Admin-apk, path: JobPaw-Admin.apk }
      - name: Publish release (not marked latest, so the worker app link is unchanged)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "admin-${{ github.run_number }}" JobPaw-Admin.apk --title "JobPaw 管理后台 v${VER}" --notes "后台管理 App：在手机上打开本页，点击 JobPaw-Admin.apk 下载安装。" --latest=false
      - name: Mirror APK to Cloudflare
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for i in 1 2 3 4 5; do
            rm -rf mirror && git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" mirror && cd mirror
            git config user.name "jobpaw-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p www/app && cp ../JobPaw-Admin.apk www/app/JobPaw-Admin.apk
            SZ=$(stat -c%s www/app/JobPaw-Admin.apk); SHA=$(sha256sum www/app/JobPaw-Admin.apk | cut -d' ' -f1)
            printf '{"build":%s,"version":"%s","size":%s,"sha256":"%s"}\n' "${{ github.run_number }}" "$VER" "$SZ" "$SHA" > www/app/admin-apk.json
            git add www/app && git commit -q -m "Admin APK build ${{ github.run_number }} mirror" && git push -q origin HEAD:main && break
            cd .. ; sleep 8
          done
