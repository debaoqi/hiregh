name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Fixed signing key (so new versions install over old ones)
        run: |
          mkdir -p ~/.android
          base64 -d android-test-signing.b64 > ~/.android/debug.keystore
      - run: npm install
      - run: pip install pillow
      - run: python3 make_icons.py www
      - run: npx cap add android
      - run: python3 make_icons.py android
      - name: Set app version
        run: |
          VER=$(node -p "require('./www/version.json').version")
          echo "VER=$VER" >> $GITHUB_ENV
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk HireGH.apk
      - uses: actions/upload-artifact@v4
        with: { name: HireGH-apk, path: HireGH.apk }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "build-${{ github.run_number }}" HireGH.apk --title "HireGH v${VER} (build ${{ github.run_number }})" --notes "Open this page on your phone and tap HireGH.apk to download and install." --latest
