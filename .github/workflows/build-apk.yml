name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: pip install pillow
      - run: python3 make_icons.py www
      - run: npx cap add android
      - run: python3 make_icons.py android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk HireGH.apk
      - uses: actions/upload-artifact@v4
        with: { name: HireGH-apk, path: HireGH.apk }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "build-${{ github.run_number }}" HireGH.apk --title "HireGH test build ${{ github.run_number }}" --notes "Open this page on your phone and tap HireGH.apk to download and install." --latest
