name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep the mirrored APK out of the app bundle
        run: rm -rf www/app
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Push notifications (only when google-services.json exists)
        run: |
          if [ -f google-services.json ]; then npm install @capacitor/push-notifications@8.1.3 && echo "PUSH=1" >> $GITHUB_ENV; else echo "No google-services.json - building without push"; fi
      - run: pip install pillow
      - run: python3 make_icons.py www
      - run: npx cap add android
      - run: python3 make_icons.py android
      - name: Firebase config
        if: env.PUSH == '1'
        run: cp google-services.json android/app/google-services.json
      - name: Location permission (for company location)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $M
          sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_jobpaw" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/jobpaw_accent" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="messages" />\n    </application>#' $M
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="jobpaw_accent">#5B8CFF</color></resources>\n' > android/app/src/main/res/values/jobpaw_colors.xml
          grep -n "string/app_name\|label" $M | head -3; cat android/app/src/main/res/values/strings.xml
          grep -n "permission" $M
      - name: In-app updater (download + install inside the app)
        run: |
          D=android/app/src/main/java/com/hiregh/app
          cp native/AppUpdaterPlugin.java $D/AppUpdaterPlugin.java
          printf 'package com.hiregh.app;\n\nimport android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(AppUpdaterPlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n}\n' > $D/MainActivity.java
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>#' $M
          mkdir -p android/app/src/main/res/xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<paths xmlns:android="http://schemas.android.com/apk/res/android">\n    <external-path name="my_images" path="." />\n    <cache-path name="my_cache_images" path="." />\n</paths>\n' > android/app/src/main/res/xml/file_paths.xml
          grep -n "fileprovider\|INSTALL_PACKAGES" $M; cat $D/MainActivity.java
      - name: Set app version
        run: |
          VER=$(node -p "require('./www/version.json').version")
          echo "VER=$VER" >> $GITHUB_ENV
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Fixed signing key (so new versions install over old ones)
        run: |
          base64 -d android-test-signing.b64 > android/app/hiregh-test.keystore
          python3 - <<'PY'
          p='android/app/build.gradle'; s=open(p).read()
          cfg='''android {
              signingConfigs {
                  debug {
                      storeFile file("hiregh-test.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }'''
          s=s.replace('android {',cfg,1); open(p,'w').write(s)
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk JobPaw.apk && cp JobPaw.apk HireGH.apk
      - name: Check signature
        run: $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs JobPaw.apk | head -3
      - uses: actions/upload-artifact@v4
        with: { name: JobPaw-apk, path: JobPaw.apk }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "build-${{ github.run_number }}" JobPaw.apk HireGH.apk --title "JobPaw v${VER} (build ${{ github.run_number }})" --notes "Open this page on your phone and tap JobPaw.apk to download and install. Push notifications: ${PUSH:-0}" --latest
      - name: Mirror APK to Cloudflare (fast download, no GitHub)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for i in 1 2 3; do
            rm -rf mirror && git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" mirror && cd mirror
            git config user.name "jobpaw-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p www/app && cp ../JobPaw.apk www/app/JobPaw.apk
            SZ=$(stat -c%s www/app/JobPaw.apk); SHA=$(sha256sum www/app/JobPaw.apk | cut -d' ' -f1)
            printf '{"build":%s,"version":"%s","size":%s,"sha256":"%s"}\n' "${{ github.run_number }}" "$VER" "$SZ" "$SHA" > www/app/apk.json
            git add www/app && git commit -q -m "APK build ${{ github.run_number }} mirror" && git push -q origin HEAD:main && break
            cd .. ; sleep 5
          done
          sleep 20; curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/www/app/JobPaw.apk" | head -c 300 || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/www/app/apk.json" | head -c 300 || true
