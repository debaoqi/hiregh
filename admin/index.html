<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HireGH 管理后台</title>
<style>
:root{--bg:#EDE8DC;--card:#FBF9F4;--ink:#161616;--ink2:#55524B;--muted:#9C978B;--line:#E7E1D4;--soft:#F3EFE6;
--lime:#CFE36B;--gold:#F8C94A;--red:#EE5A47;--lilac:#E2B2FA;--blue:#5B8CFF;--bar:#2E3A12;--side:#161616}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.app{display:flex;min-height:100vh}
.side{width:228px;background:var(--side);color:#cfcfcf;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;flex:none}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:17px;padding:4px 8px 18px}
.logo{object-fit:cover;background:none!important;width:34px;height:34px;border-radius:11px;background:var(--lime);color:#161616;display:grid;place-items:center;font-weight:900}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;cursor:pointer;text-decoration:none;color:inherit}
.nav a:hover{background:#242424}
.nav a.on{background:var(--lime);color:#161616;font-weight:700}
.nav .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px;font-weight:700}
.side .foot{margin-top:auto;font-size:12px;color:#8a8a8a;padding:8px}
.main{flex:1;min-width:0;padding:18px 26px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:26px;letter-spacing:-.5px;margin-right:auto}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:30px;padding:9px 14px;min-width:260px;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:9px 16px;font-weight:600;background:var(--card);white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.dark{background:#161616;color:#fff}.btn.lime{background:var(--lime)}.btn.red{background:var(--red);color:#fff}.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:var(--card);border-radius:24px;padding:18px}
.kpi .l{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .n{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:6px}
.kpi .d{font-size:12px;color:var(--ink2);margin-top:2px}
.kpi.hl{background:var(--lime)}.kpi.warn{background:var(--gold)}
.row2{grid-template-columns:2fr 1fr;margin-top:14px}
.row3{grid-template-columns:1fr 1fr 1fr;margin-top:14px}
.ch{font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ch .sub{font-weight:500;font-size:12.5px;color:var(--muted)}
.ch .r{margin-left:auto;display:flex;gap:6px}
.seg{display:inline-flex;background:var(--soft);border-radius:30px;padding:3px}
.seg button{padding:6px 12px;border-radius:26px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:#161616;color:#fff}
.hbar{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.hbar .t{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--bar);border-radius:0 6px 6px 0}
.hbar .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tr:hover td{background:#F7F4EC}
.tbl tr.clk{cursor:pointer}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.who small{color:var(--muted);font-size:12px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;background:#ddd center/cover}
.av.lg{width:76px;height:76px;font-size:26px}
.flag{width:20px;height:14px;border-radius:3px;display:inline-block;position:relative;overflow:hidden;vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.flag i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:8px}
.st-pending{background:#FCE7A6}.st-approved{background:#DDEFA0}.st-rejected{background:#FAD2CB}.st-disabled{background:#E3E0DA;color:#666}.st-offline{background:#E3E0DA;color:#666}.st-open{background:#FAD2CB}.st-doing{background:#FCE7A6}.st-done{background:#DDEFA0}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sel{appearance:none;background:var(--card);border:0;border-radius:30px;padding:8px 30px 8px 14px;font-weight:600;font-size:13px;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.bulk{display:flex;align-items:center;gap:8px;background:#161616;color:#fff;border-radius:18px;padding:8px 10px 8px 16px;margin-bottom:10px}
.bulk .btn{background:#2a2a2a;color:#fff}.bulk .btn.lime{background:var(--lime);color:#161616}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:12px;color:var(--ink2);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px}
input[type=checkbox]{width:17px;height:17px;accent-color:#161616;cursor:pointer}
/* drawer & modal */
.mask{position:fixed;inset:0;background:rgba(20,20,20,.35);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;transform:translateX(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dbody{flex:1;overflow-y:auto;padding:20px 22px}
.dfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:var(--bg)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);opacity:0;pointer-events:none;width:min(620px,94vw);max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:26px;padding:22px;z-index:51;transition:.2s}
.modal.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.mask2{z-index:50}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.kv .l{font-size:12px;color:var(--muted)}.kv .v{font-weight:600;margin-top:2px;word-break:break-word}
.sec{font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.idimg{width:100%;border-radius:16px;background:#fff center/contain no-repeat;height:200px;cursor:zoom-in;border:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;color:var(--muted);font-weight:600}
.inp{background:var(--card);border:1.5px solid transparent;border-radius:14px;padding:10px 12px;outline:none;width:100%}
.inp:focus{border-color:#161616;background:#fff}
textarea.inp{min-height:80px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#161616;color:#fff;padding:12px 18px;border-radius:30px;opacity:0;transition:.25s;z-index:70;pointer-events:none;display:flex;gap:8px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tip{position:fixed;pointer-events:none;background:#161616;color:#fff;font-size:12px;padding:7px 10px;border-radius:10px;z-index:80;opacity:0;transition:opacity .1s;white-space:nowrap}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{background:var(--card);border-radius:30px;padding:30px;width:min(400px,100%)}
.note{background:var(--soft);border-radius:16px;padding:12px 14px;font-size:12.5px;color:var(--ink2);line-height:1.6}
.list .it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:90;cursor:zoom-out}
.lb img{max-width:92vw;max-height:90vh;border-radius:10px}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.row3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.app{flex-direction:column}.side{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px}.brand{padding:4px 8px}.nav{display:flex;gap:4px}.nav a{white-space:nowrap}.side .foot{display:none}
 .main{padding:14px}.row2,.row3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.hide-sm{display:none}.f2{grid-template-columns:1fr}}
</style>

<script>
/* ===== 云端配置：与 App 填写相同的 Supabase 信息（留空 = 演示模式） ===== */
window.HIREGH_CONFIG = window.HIREGH_CONFIG || {

</script>
<script>
const CFG=window.HIREGH_CONFIG||{};const LIVE=!!(CFG.supabaseUrl&&CFG.supabaseAnonKey)&&!/[?&]demo\b/.test(location.search);
const U=(CFG.supabaseUrl||'').replace(/\/$/,''),K=CFG.supabaseAnonKey;
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeImg=u=>typeof u==='string'&&(/^data:image\/(png|jpe?g|webp|gif|svg\+xml);/i.test(u)||/^https:\/\//.test(u))?u:'';
const P={dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',check:'<path d="m5 12 5 5 9-10"/>',users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7M16 4a4 4 0 0 1 0 8M22 21c0-3-1.8-5.6-4.5-6.6"/>',brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',build:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>',flagi:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',log:'<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',dl:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',out:'<path d="M15 4h4v16h-4M10 17l5-5-5-5M15 12H3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',alert:'<path d="M12 3 2 21h20zM12 10v5M12 18v.01"/>'};
const ic=(n,s)=>`<svg class="i" viewBox="0 0 24 24" ${s?`style="width:${s}px;height:${s}px"`:''}>${P[n]||''}</svg>`;
function toast(m){const t=$('#toast');t.innerHTML=ic('check',16)+esc(m);t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
const day=d=>new Date(d).toISOString().slice(0,10);
const fmt=d=>{if(!d)return '—';const x=new Date(d);return `${x.getUTCMonth()+1}月${x.getUTCDate()}日 ${String(x.getUTCHours()).padStart(2,'0')}:${String(x.getUTCMinutes()).padStart(2,'0')}`};
const money=n=>'GH₵'+(+n||0).toLocaleString('en-US');

/* ---------- reference data (same as App) ---------- */
const NATS={GH:['加纳','linear-gradient(#CE1126 0 33%,#FCD116 33% 66%,#006B3F 66%)','#000'],CN:['中国','#DE2910','#FFDE00']};
const flag=c=>{const n=NATS[c];if(!n){const e=c&&/^[A-Z]{2}$/.test(c)?String.fromCodePoint(...[...c].map(x=>0x1F1E6+x.charCodeAt(0)-65)):'';return e?`<span title="${c}" style="font-size:15px">${e}</span>`:''}return `<span class="flag" style="background:${n[1]}">${n[2]?`<i style="color:${n[2]}">★</i>`:''}</span>`};
const natName=c=>NATS[c]?NATS[c][0]:esc(c||'—');
const IND={ind:['工业制造',['焊工','电工','机修工','叉车司机','CNC操作工','质检员','普工']],agr:['农业种植',['种植工','农机手','养殖工','采摘工','灌溉技工','农场主管']],svc:['服务业',['中餐厨师','司机','保安','保洁','中英翻译','家政保姆','会计文员']],con:['建筑工程',['泥瓦工','钢筋工','木工','水电工','挖掘机司机','测量员']],min:['矿业能源',['矿工','爆破员','重卡司机','设备维修','选矿工']],log:['物流仓储',['仓管员','装卸工','货车司机','报关员']]};
const indName=i=>IND[i]?IND[i][0]:esc(i||'—');
const CITIES=['阿克拉','特马','库马西','塔科拉迪','卡索阿','塔马利','奥布阿西','科福里杜阿'];
const ZH=['不会','基础','流利','母语'];const AVAIL=['可立即上岗','1周内到岗','2周内到岗'];
const ST={pending:'待审核',approved:'已通过',rejected:'已驳回',disabled:'已停用',offline:'已下架',open:'待处理',doing:'处理中',done:'已处理'};
const stChip=s=>`<span class="chip st-${esc(s)}">${s==='pending'||s==='open'?ic('clock',13):s==='approved'||s==='done'?ic('check',13):ic('ban',13)}${ST[s]||esc(s)}</span>`;
const avatar=(w,cls='')=>{const p=safeImg(w.d.photo);const nm=String(w.d.name||'?');const ini=/[一-龥]/.test(nm)?nm.slice(-1):nm.split(' ').filter(Boolean).slice(0,2).map(s=>s[0]).join('');
  return p?`<div class="av ${cls}" style="background-image:url('${p}')"></div>`:`<div class="av ${cls}" style="background:${esc(w.d.col||'#E2B2FA')}">${esc(ini)}</div>`};

/* ---------- state ---------- */
const S={page:'dash',session:null,W:[],J:[],E:[],R:[],L:[],A:[],docs:{},days:30,
  wf:{q:'',status:'all',nat:'all',ind:'all',range:'all'},wpg:1,sel:new Set(),jf:'all',ef:'all',rf:'all',lq:''};

/* ---------- API (Supabase or demo) ---------- */
async function q(path,opt={}){
  const r=await fetch(U+'/rest/v1/'+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+S.session.token,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});
  if(r.status===401){logout();throw new Error('登录已过期，请重新登录')}
  if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
const API={
  async login(email,pw){
    if(!LIVE){S.session={email:'demo@hiregh',demo:true};return}
    const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
    const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'登录失败');
    S.session={token:j.access_token,email:j.user.email,uid:j.user.id}},
  async load(){
    if(!LIVE){demo();return}
    const [a,w,j,e,rp,l]=await Promise.all([q('admins?select=*'),q('workers?select=*&order=id.desc&limit=5000'),q('jobs?select=*&order=id.desc&limit=2000'),q('employers?select=*&order=id.desc&limit=2000'),q('reports?select=*&order=id.desc&limit=2000'),q('audit_log?select=*&order=id.desc&limit=500')]);
    if(!a.some(x=>x.user_id===S.session.uid))throw new Error('该账号不是管理员。请在 Supabase 的 admins 表中添加此账号。');
    S.A=a;S.W=w.map(r=>({id:r.id,created_at:r.created_at,status:r.status||'pending',review:r.review||null,d:r.data||{}}));
    S.J=j.map(r=>({id:r.id,created_at:r.created_at,status:r.status||'pending',d:r.data||{}}));
    S.E=e.map(r=>({id:r.id,created_at:r.created_at,status:r.status||'pending',d:r.data||{}}));
    S.R=rp.map(r=>({id:r.id,created_at:r.created_at,status:r.status||'open',d:r.data||{}}));S.L=l},
  async patch(t,id,body){if(LIVE)await q(`${t}?id=eq.${id}`,{method:'PATCH',body:JSON.stringify(body)})},
  async del(t,id){if(LIVE)await q(`${t}?id=eq.${id}`,{method:'DELETE'})},
  async docs(wid){if(!LIVE)return S.docs[wid]||null;if(S.docs[wid]!==undefined)return S.docs[wid];const r=await q(`worker_docs?worker_id=eq.${wid}&order=id.desc&limit=1`);return S.docs[wid]=r[0]||null},
  async patchDocs(wid,data){const d=await API.docs(wid);if(!d)return;d.data={...d.data,...data};if(LIVE)await q(`worker_docs?id=eq.${d.id}`,{method:'PATCH',body:JSON.stringify({data:d.data})})},
  async log(action,target,detail={}){const row={id:Date.now(),created_at:new Date().toISOString(),admin:S.session.email,action,target,detail};S.L.unshift(row);
    if(LIVE)q('audit_log',{method:'POST',body:JSON.stringify({admin:row.admin,action,target,detail})}).catch(()=>{})}};
async function run(fn,ok){try{await fn();if(ok)toast(ok);render()}catch(e){console.error(e);toast('操作失败：'+String(e.message||e).slice(0,80))}}

/* ---------- demo data ---------- */
function demo(){

function bindChart(){

async function openWorker(id){const w=S.W.find(x=>x.id===id);if(!w)return;

    <div><div class="l">电话 / WhatsApp</div><div class="v">${esc(dd.phone||'—')}</div></div><div><div class="l">城市</div><div class="v">${esc(w.d.city)}</div></div>
    <div><div class="l">工作经验</div><div class="v">${esc(w.d.exp)} 年</div></div><div><div class="l">期望月薪</div><div class="v">${money(w.d.sal)}</div></div>

    <div><div class="l">手机语言</div><div class="v">${esc((w.d.lang||dd.lang||'—').toUpperCase())}</div></div><div><div class="l">注册时间</div><div class="v">${fmt(w.created_at)}</div></div></div>

   <div class="card"><div class="kv" style="margin-bottom:12px"><div><div class="l">证件类型</div><div class="v">${esc(dd.idType||'—')}</div></div><div><div class="l">同意数据条款</div><div class="v">${dd.consentAt?fmt(dd.consentAt):'—'}</div></div>
    ${nonGH?`<div><div class="l">自述工作许可</div><div class="v">${dd.permit===true?'有':dd.permit===false?'没有':'未填'}</div></div>`:''}<div><div class="l">自述健康证明</div><div class="v">${dd.health===true?'有':dd.health===false?'没有':'未填'}</div></div></div>
    ${idp?`<div class="idimg" style="background-image:url('${idp}')" onclick="lb('${idp.replace(/'/g,'%27')}')"></div>`:'<div class="note">未上传证件照片</div>'}</div>

function closeDrawer(){$('#drawer').classList.remove('on');$('#mask').classList.remove('on')}
function lb(u){$('#lbimg').src=u;$('#lb').style.display='grid'}
async function setWorkerStatus(w,status,reason,checks,silent){
  const review={by:S.session.email,at:new Date().toISOString(),reason:reason||'',note:checks&&checks.note||''};
  const d={...w.d,pending:status==='pending'};
  if(checks){d.card=checks.id;d.health=checks.health;d.police=checks.police;if(w.d.nat!=='GH')d.permit=checks.permit}
  await API.patch('workers',w.id,{status,review,data:d});w.status=status;w.review=review;w.d=d;
  if(!silent)await API.log(status==='approved'?'审核通过':status==='rejected'?'驳回工人':status==='disabled'?'停用工人':'更新状态','worker:'+w.id,{name:w.d.name,reason:reason||undefined});
}
function reviewWorker(id,status){const w=S.W.find(x=>x.id===id);const g=k=>{const e=$('#'+k);return e?e.checked:false};
  const checks={id:g('c_id'),permit:g('c_permit'),health:g('c_health'),police:g('c_police'),note:($('#nt')||{}).value||''};const reason=($('#rj')||{}).value||'';
  if(status==='rejected'&&!reason){toast('请选择驳回原因');$('#rj').focus();return}
  if(status==='approved'&&!checks.id){confirmBox('还没有勾选“身份证件真实有效”，仍然通过吗？',()=>run(()=>setWorkerStatus(w,status,'',checks).then(()=>{closeDrawer();closeModal()}),'已通过'));return}
  run(async()=>{await setWorkerStatus(w,status,reason,checks);closeDrawer()},status==='approved'?'已审核通过':status==='rejected'?'已驳回':'已停用');
}
function delWorker(id){const w=S.W.find(x=>x.id===id);confirmBox(`永久删除「${esc(w.d.name)}」的档案和证件？此操作无法撤销。`,()=>run(async()=>{await API.del('workers',id);S.W=S.W.filter(x=>x.id!==id);await API.log('删除工人','worker:'+id,{name:w.d.name});closeDrawer();closeModal()},'已删除'),'永久删除')}
async function editWorker(id){const w=S.W.find(x=>x.id===id);let doc=null;try{doc=await API.docs(id)}catch(e){}const ph=doc&&doc.data?doc.data.phone||'':'';
  const o=(arr,v)=>arr.map(x=>Array.isArray(x)?`<option value="${x[0]}" ${x[0]===v?'selected':''}>${x[1]}</option>`:`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
  openModal(`<div class="ch">编辑工人资料 #${id}<div class="r"><button class="btn sm" onclick="closeModal()">${ic('x')}</button></div></div>
  <div class="f2"><div class="fld"><label>姓名</label><input class="inp" id="e_name" value="${esc(w.d.name)}"></div><div class="fld"><label>电话</label><input class="inp" id="e_phone" value="${esc(ph)}" ${doc?'':'disabled'}></div>
   <div class="fld"><label>国籍</label><select class="inp" id="e_nat">${o([...new Set([...Object.keys(NATS),w.d.nat].filter(Boolean))].map(c=>[c,NATS[c]?NATS[c][0]:c]),w.d.nat)}</select></div><div class="fld"><label>性别</label><select class="inp" id="e_sex">${o([['m','男'],['f','女']],w.d.female?'f':'m')}</select></div>
   <div class="fld"><label>年龄</label><input class="inp" id="e_age" type="number" value="${esc(w.d.age||'')}"></div><div class="fld"><label>城市</label><select class="inp" id="e_city">${o(CITIES,w.d.city)}</select></div>
   <div class="fld"><label>行业</label><select class="inp" id="e_ind" onchange="$('#e_role').innerHTML=IND[this.value][1].map(r=>'<option>'+r+'</option>').join('')">${o(Object.keys(IND).map(i=>[i,IND[i][0]]),w.d.ind)}</select></div><div class="fld"><label>工种</label><select class="inp" id="e_role">${o((IND[w.d.ind]||IND.ind)[1],w.d.role)}</select></div>
   <div class="fld"><label>经验（年）</label><input class="inp" id="e_exp" type="number" value="${esc(w.d.exp)}"></div><div class="fld"><label>期望月薪 GH₵</label><input class="inp" id="e_sal" type="number" value="${esc(w.d.sal)}"></div>
   <div class="fld"><label>中文水平</label><select class="inp" id="e_zh">${o(ZH,w.d.zh)}</select></div><div class="fld"><label>到岗时间</label><select class="inp" id="e_av">${o(AVAIL,w.d.avail)}</select></div></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px"><button class="btn" onclick="closeModal()">取消</button><button class="btn dark" onclick="saveWorker(${id})">保存修改</button></div>`)}
function saveWorker(id){const w=S.W.find(x=>x.id===id);const v=k=>$('#e_'+k).value;
  const d={...w.d,name:v('name').trim(),nat:v('nat'),female:v('sex')==='f',age:+v('age')||null,city:v('city'),ind:v('ind'),role:v('role'),exp:+v('exp')||0,sal:+v('sal')||0,zh:v('zh'),avail:v('av')};
  if(!d.name){toast('姓名不能为空');return}
  const changed=Object.keys(d).filter(k=>JSON.stringify(d[k])!==JSON.stringify(w.d[k]));const phone=v('phone');
  run(async()=>{await API.patch('workers',id,{data:d});w.d=d;const doc=await API.docs(id).catch(()=>null);if(doc&&phone!==(doc.data||{}).phone){await API.patchDocs(id,{phone});changed.push('phone')}
    await API.log('编辑工人资料','worker:'+id,{name:d.name,fields:changed.join(',')});closeModal();if($('#drawer').classList.contains('on'))openWorker(id)},'已保存')}

  const val=(r,c)=>typeof c[0]==='function'?c[0](r):r[c[0]];const cell=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};

<script>
/* ================= 自动刷新 + 新提交提醒 ================= */
const AR={sec:+(localStorage.getItem('hg_ar')??10),timer:null,seen:null,last:0,fresh:{W:0,E:0,J:0,R:0},busy:false,baseTitle:document.title};
const arSnap=()=>({W:new Set(S.W.map(x=>x.id)),E:new Set(S.E.map(x=>x.id)),J:new Set(S.J.map(x=>x.id)),R:new Set(S.R.map(x=>x.id))});
/* 登录令牌快到期时自动续期，避免自动刷新中途掉线 */
const _login0=API.login;
API.login=async function(email,pw){
  if(!LIVE){await _login0.call(API,email,pw);AR.seen=null;setTimeout(arStart,300);return}
  const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'登录失败');
  S.session={token:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,email:j.user.email,uid:j.user.id};
  AR.seen=null;setTimeout(arStart,300)};
async function arRenew(){const s=S.session;if(!LIVE||!s||!s.refresh||Date.now()<s.exp-5*60e3)return;
  try{const r=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh})});
    const j=await r.json();if(r.ok){s.token=j.access_token;s.refresh=j.refresh_token;s.exp=Date.now()+(j.expires_in||3600)*1000}}catch(e){}}
function arBeep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.18].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.15,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.15);o.start(c.currentTime+t);o.stop(c.currentTime+t+.16)})}catch(e){}}
async function arTick(manual){
  if(!S.session||AR.busy)return;AR.busy=true;
  const ui=document.querySelector('#modal.on,#drawer.on')||(document.activeElement&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&document.activeElement.id!=='arSel');
  try{await arRenew();const first=!AR.seen;const before=AR.seen||arSnap();await API.load();const now=arSnap();AR.seen=now;AR.last=Date.now();
    const add={W:0,E:0,J:0,R:0};for(const k in add)now[k].forEach(id=>{if(!before[k].has(id))add[k]++});
    const n=first?0:add.W+add.E+add.J+add.R;
    if(n){for(const k in add)AR.fresh[k]+=add[k];arBeep();
      const msg=[add.W&&`工人 ${add.W}`,add.E&&`招聘方 ${add.E}`,add.J&&`岗位 ${add.J}`,add.R&&`举报/反馈 ${add.R}`].filter(Boolean).join('、');
      toast('新提交：'+msg);
      try{if('Notification' in window&&Notification.permission==='granted')new Notification('HireGH 新提交',{body:msg})}catch(e){}}
    arTitle();if(!ui)render();else arBar()}
  catch(e){console.error(e)}finally{AR.busy=false}}
function arTitle(){const t=AR.fresh.W+AR.fresh.E+AR.fresh.J+AR.fresh.R;document.title=t?`(${t}) 新提交 · ${AR.baseTitle}`:AR.baseTitle}
function arStart(){clearInterval(AR.timer);if(AR.sec>0)AR.timer=setInterval(()=>{if(!document.hidden||AR.sec<=10)arTick()},AR.sec*1000);arBar()}
function arSet(v){AR.sec=+v;localStorage.setItem('hg_ar',AR.sec);
  if(AR.sec>0&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{});
  arStart();toast(AR.sec?`已开启自动刷新：每 ${AR.sec} 秒`:'已关闭自动刷新')}
function arSeen(page){const map={review:'W',workers:'W',employers:'E',jobs:'J',reports:'R'};const k=map[page];if(k)AR.fresh[k]=0;if(page==='dash')AR.fresh={W:0,E:0,J:0,R:0};arTitle()}
function arAgo(){if(!AR.last)return '尚未刷新';const s=Math.round((Date.now()-AR.last)/1000);return s<5?'刚刚':s+' 秒前'}
/* 顶部：自动刷新开关 + 新提交提醒条 */
function arBar(){const top=document.querySelector('.main .top');if(!top)return;
  let el=document.getElementById('arBox');if(!el){el=document.createElement('div');el.id='arBox';el.style.cssText='display:flex;align-items:center;gap:8px;font-size:13px';const rb=top.querySelector('button[onclick="reload()"]');top.insertBefore(el,rb||null)}
  el.innerHTML=`<span style="width:8px;height:8px;border-radius:50%;background:${AR.sec?'#3BB273':'#bbb'};${AR.sec?'box-shadow:0 0 0 4px rgba(59,178,115,.18)':''}"></span>
   <select id="arSel" class="btn" style="padding:7px 10px" onchange="arSet(this.value)">${[[0,'自动刷新：关'],[5,'自动刷新：5 秒'],[10,'自动刷新：10 秒'],[30,'自动刷新：30 秒']].map(o=>`<option value="${o[0]}" ${AR.sec===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
   <span id="arAgo" style="color:var(--muted);min-width:56px">${arAgo()}</span>`;
  const f=AR.fresh,t=f.W+f.E+f.J+f.R;let bn=document.getElementById('arNew');
  if(t){const page=f.W?'review':f.E?'employers':f.J?'jobs':'reports';
    if(!bn){bn=document.createElement('div');bn.id='arNew';top.after(bn)}
    bn.innerHTML=`<div style="display:flex;align-items:center;gap:10px;background:#161616;color:#fff;border-radius:14px;padding:12px 16px;margin:-6px 0 16px;font-size:14px">
     <span style="width:10px;height:10px;border-radius:50%;background:#EE5A47"></span><b>手机端有 ${t} 条新提交</b><span style="opacity:.75">${[f.W&&`工人 ${f.W}`,f.E&&`招聘方 ${f.E}`,f.J&&`岗位 ${f.J}`,f.R&&`举报/反馈 ${f.R}`].filter(Boolean).join(' · ')}</span>
     <button class="btn sm lime" style="margin-left:auto" onclick="go('${page}')">立即查看</button><button class="btn sm" style="color:#161616" onclick="AR.fresh={W:0,E:0,J:0,R:0};arTitle();document.getElementById('arNew').remove()">知道了</button></div>`}
  else if(bn)bn.remove()}
setInterval(()=>{const a=document.getElementById('arAgo');if(a)a.textContent=arAgo()},1000);
const _render0=render;render=function(){_render0();if(S.session){if(!AR.seen&&(S.W.length||S.J.length||S.E.length||LIVE))AR.seen=arSnap();if(!AR.timer&&AR.sec>0)arStart();arBar();admVerBar()}};
const _go0=go;go=function(p){arSeen(p);return _go0(p)};
window.addEventListener('focus',()=>{if(AR.sec)arTick()});
if(S.session){AR.seen=arSnap();arStart()}


/* 后台自身版本检查：后台更新后提示刷新页面，避免一直使用旧版本 */

  d.innerHTML='<b>后台已更新到新版本</b><span style="opacity:.7">刷新后生效（需要重新登录）</span><button class="btn sm lime" onclick="location.reload()">立即刷新</button>';document.body.appendChild(d)}

  ws.forEach((w,k)=>{const e=es[k%es.length];const t=n=>new Date(now-(k*3+n)*36e5).toISOString();

function mThreads(){const by={};S.M.forEach(r=>{const k=r.worker_id+'-'+r.employer_id;const t=by[k]||(by[k]={k,w:r.worker_id,e:r.employer_id,n:0,last:r,inv:0,acc:0,dec:0,unread:0});t.n++;
  if(r.id>t.last.id)t.last=r;if(r.kind==='invite')t.inv++;if(r.kind==='invite_reply')(r.meta||{}).ans==='accept'?t.acc++:t.dec++;if(!r.read_at)t.unread++});
  let l=Object.values(by).sort((a,b)=>b.last.id-a.last.id);const qv=S.mq.trim().toLowerCase();
  if(qv)l=l.filter(t=>(mName(t.last,'w')+' '+mName(t.last,'e')+' '+S.M.filter(r=>r.worker_id===t.w&&r.employer_id===t.e).map(r=>r.body+' '+(r.trans||'')).join(' ')).toLowerCase().includes(qv));
  if(S.mk==='invite')l=l.filter(t=>t.inv);if(S.mk==='pending')l=l.filter(t=>t.inv>t.acc+t.dec);return l}
function mPrev(r){const mt=r.meta||{};if(r.kind==='invite')return '📅 面试邀请：'+(mt.job||'');if(r.kind==='invite_reply')return mt.ans==='accept'?'✅ 已接受面试':'❌ 已拒绝面试';if(r.kind==='cancel')return '已取消面试';if(r.kind==='apply')return '申请岗位：'+(mt.job||'');return r.body}
V.messages=()=>{const th=mThreads();const today=new Date().toDateString();const all=S.M;
  if(S.mt&&!th.some(t=>t.k===S.mt))S.mt=th[0]?th[0].k:null;if(!S.mt&&th[0])S.mt=th[0].k;
  const st=[['消息总数',all.length],['对话数',new Set(all.map(r=>r.worker_id+'-'+r.employer_id)).size],['今日消息',all.filter(r=>new Date(r.created_at).toDateString()===today).length],
    ['面试邀请',all.filter(r=>r.kind==='invite').length],['已接受',all.filter(r=>r.kind==='invite_reply'&&(r.meta||{}).ans==='accept').length],['未读',all.filter(r=>!r.read_at).length]];
  const cur=th.find(t=>t.k===S.mt);
  return `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr));margin-bottom:14px">${st.map(s=>`<div class="card" style="padding:14px 16px"><div style="font-size:12px;color:var(--muted)">${s[0]}</div><div style="font-size:24px;font-weight:800;margin-top:2px">${s[1]}</div></div>`).join('')}</div>
  <div class="filters"><div class="seg">${[['all','全部对话'],['invite','有面试邀请'],['pending','待工人回复']].map(x=>`<button class="${S.mk===x[0]?'on':''}" onclick="S.mk='${x[0]}';S.mt=null;render()">${x[1]}</button>`).join('')}</div>
   <div class="search" style="max-width:300px">${ic('search')}<input id="mqI" placeholder="搜索姓名 / 企业 / 消息内容" value="${esc(S.mq)}" oninput="clearTimeout(window._mq);window._mq=setTimeout(()=>{S.mq=this.value;S.mt=null;render();const i=document.getElementById('mqI');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)"></div></div>
  <div class="msgwrap"><div class="card mlist">${th.map(t=>{const w=mW(t.w);return `<div class="mrow ${t.k===S.mt?'on':''}" onclick="S.mt='${t.k}';render()">${w?avatar(w):'<div class="av" style="background:#ddd">?</div>'}<div style="flex:1;min-width:0">
     <div style="display:flex;gap:6px;align-items:center"><b class="ell">${esc(mName(t.last,'w'))}</b><span style="color:var(--muted)">⇄</span><span class="ell" style="font-weight:600">${esc(mName(t.last,'e'))}</span></div>
     <div class="ell" style="font-size:12.5px;color:var(--ink2);margin-top:2px">${esc(mPrev(t.last))}</div>
     <div style="font-size:11.5px;color:var(--muted);margin-top:3px">${fmt(t.last.created_at)} · ${t.n} 条${t.inv?` · 邀请 ${t.inv}`:''}${t.acc?` · <span style="color:#2e7d32">接受 ${t.acc}</span>`:''}${t.dec?` · <span style="color:#c0392b">拒绝 ${t.dec}</span>`:''}</div></div></div>`}).join('')||'<div class="empty">暂无对话</div>'}</div>
   <div class="card mthread">${cur?mThreadView(cur):'<div class="empty">选择左侧对话查看聊天记录</div>'}</div></div>
  <div class="note" style="margin-top:12px">这里是工人与招聘方在 App 中的全部聊天和面试邀请记录（只读）。发现收费、骚扰等违规内容可删除单条消息，并到“工人管理 / 招聘方管理”停用账号。停用后对方无法再发送消息。</div>`};
function mThreadView(t){const w=mW(t.w),e=mE(t.e);const rows=S.M.filter(r=>r.worker_id===t.w&&r.employer_id===t.e).sort((a,b)=>a.id-b.id);
  return `<div class="mhead"><div style="display:flex;gap:10px;align-items:center;min-width:0">${w?avatar(w):''}<div style="min-width:0"><b class="ell">${esc(mName(t.last,'w'))}</b><div style="font-size:12px;color:var(--muted)">工人 #${t.w}${w?' · '+esc(w.d.role||'')+' · '+stChip(w.status):' · 已删除'}</div></div></div>
   <div style="text-align:right;min-width:0"><b class="ell">${esc(mName(t.last,'e'))}</b><div style="font-size:12px;color:var(--muted)">招聘方 #${t.e}${e?' · '+esc(e.d.contact||'')+' '+esc(e.d.phone||'')+' · '+stChip(e.status):' · 已删除'}</div></div></div>
   <div class="mbody">${rows.map(r=>{const me=r.sender==='e';const mt=r.meta||{};
     let inner=esc(r.body);if(r.kind==='invite')inner=`<div style="font-size:12px;opacity:.7">📅 面试邀请</div><b>${esc(mt.job||'')}</b> · ${esc(mt.m)}月${esc(mt.d)}日 ${esc(mt.time||'')} · ${esc(mt.way||'')}${mt.place?'<br>📍 '+esc(mt.place):''}<div style="margin-top:6px">${mt.cancel?'已取消':mt.ans==='accept'?'✅ 工人已接受':mt.ans==='decline'?'❌ 工人已拒绝':'⏳ 等待回复'}</div>`;
     if(r.kind==='invite_reply')inner=`<b>${mt.ans==='accept'?'✅ 接受面试邀请':'❌ 拒绝面试邀请'}</b>${mt.phone?' · 电话 '+esc(mt.phone):''}<div style="margin-top:4px">${esc(r.body)}</div>`;
     if(r.kind==='apply')inner=`<div style="font-size:12px;opacity:.7">岗位申请 · ${esc(mt.job||'')}</div>${esc(r.body)}`;
     return `<div class="mb ${me?'me':''}"><div class="mbb">${inner}${r.trans&&r.trans!==r.body&&r.kind!=='invite'?`<div class="mtr">译：${esc(r.trans)}</div>`:''}</div>
      <div class="mmeta">${me?'招聘方':'工人'} · ${fmt(r.created_at)} · ${KIND[r.kind]||r.kind}${r.read_at?' · 已读':' · 未读'} <a onclick="delMsg(${r.id})">删除</a></div></div>`}).join('')}</div>`}
function delMsg(id){const r=S.M.find(x=>x.id===id);if(!r)return;confirmBox(`删除这条消息？删除后双方 App 中都不再显示。<br><span style="color:var(--muted)">${esc(String(r.body).slice(0,80))}</span>`,()=>run(async()=>{
  await API.del('messages',id);S.M=S.M.filter(x=>x.id!==id);await API.log('删除聊天消息','message:'+id,{worker:r.worker_id,employer:r.employer_id,body:String(r.body).slice(0,60)});closeModal()},'已删除'),'删除')}
document.head.insertAdjacentHTML('beforeend',`<style>
.msgwrap{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:14px;align-items:start}
.mlist{padding:6px;max-height:68vh;overflow:auto}.mrow{display:flex;gap:10px;padding:10px;border-radius:14px;cursor:pointer;align-items:center}.mrow:hover{background:var(--soft)}.mrow.on{background:var(--lime)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:100%}
.mthread{padding:0;display:flex;flex-direction:column;max-height:68vh}.mhead{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mbody{padding:14px 16px;overflow:auto;flex:1}.mb{margin:8px 0;max-width:80%}.mb.me{margin-left:auto;text-align:right}
.mbb{display:inline-block;text-align:left;background:var(--soft);padding:10px 13px;border-radius:16px;line-height:1.5;font-size:13.5px}.mb.me .mbb{background:#161616;color:#fff}
.mtr{font-size:12px;opacity:.7;margin-top:5px;padding-top:5px;border-top:1px solid rgba(127,127,127,.3)}
.mmeta{font-size:11px;color:var(--muted);margin-top:3px}.mmeta a{color:#c0392b;cursor:pointer;margin-left:6px}
@media (max-width:860px){.msgwrap{grid-template-columns:1fr}.mlist,.mthread{max-height:none}}</style>`);
if(LIVE&&S.session)API.load().then(render).catch(()=>{});

</script>
