<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EDE8DC">
<title>JobPaw</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#EDE8DC;--card:#FBF9F4;--ink:#161616;--muted:#9C978B;--line:#ECE6DA;--soft:#F1EDE3;
  --purple:#9D7DFF;--lilac:#E2B2FA;--gold:#F8C94A;--red:#EE5A47;--lime:#CFE36B;--orange:#FF9F43;--blue:#5B8CFF;--green:#1E7A4C;
  --r:28px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:#D9D2C1;background-image:linear-gradient(#cfc7b5 1px,transparent 1px),linear-gradient(90deg,#cfc7b5 1px,transparent 1px);background-size:32px 32px;
  display:flex;align-items:center;justify-content:center;min-height:100vh}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.phone{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);overflow:hidden}
.sbar{display:none}
@media (min-width:520px){
  .phone{width:390px;height:min(844px,calc(100vh - 32px));min-height:600px;border-radius:54px;border:11px solid #111;box-shadow:0 40px 80px rgba(0,0,0,.25)}
  .sbar{display:flex;position:absolute;top:0;left:0;right:0;height:46px;z-index:30;justify-content:space-between;align-items:center;padding:6px 30px 0;font-weight:600;font-size:15px;pointer-events:none}
  .sbar .island{width:110px;height:30px;background:#111;border-radius:20px}
  .phone .screen{top:46px}
  .sbar{background:var(--bg)}
}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:120px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.nonav{padding-bottom:120px}
.screen.chatpad{padding-bottom:150px}
.pad{padding:12px 20px}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:10px}.gap6{gap:6px}.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:700}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#111;flex:none;font-size:15px;position:relative}
.av.lg{width:92px;height:92px;font-size:30px;border:4px solid #fff}
.av.sm{width:36px;height:36px;font-size:13px}
.icbtn{width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;position:relative;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.icbtn.dark{background:#161616;color:#fff}
.dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
.hero{font-size:36px;line-height:1.18;font-weight:800;letter-spacing:-1px;margin:26px 0 20px}
.hero .hl{background:var(--gold);padding:0 8px;border-radius:14px;display:inline-block;transform:rotate(-2deg)}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:30px;padding:8px 8px 8px 18px;color:var(--muted)}
.searchbar input{flex:1;border:0;background:none;outline:none;font-size:15px;color:var(--ink);min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.dark{background:#161616;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--card);border-radius:20px;padding:12px}
.stat .n{font-size:22px;font-weight:800;letter-spacing:-.5px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px;font-size:19px;font-weight:800}
.sec-h a{font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
/* stacked industry cards */
.stack .sc{border-radius:30px;padding:18px 18px 40px;margin-top:-26px;position:relative;cursor:pointer;transition:transform .15s}
.stack .sc:first-child{margin-top:0}
.stack .sc:active{transform:scale(.98)}
.sc .ic{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#111}
.sc .go{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#111}
.sc .t{font-size:19px;font-weight:800}
.sc .roles{font-size:12px;opacity:.75;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .row.gap:first-child{min-width:0;flex:1}.sc .row.gap>div:last-child{min-width:0}
.sc span.sm{white-space:nowrap}
.sc.last{padding-bottom:22px}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.natc{background:var(--card);border-radius:22px;padding:12px 14px;min-width:112px;cursor:pointer;flex:none}
.natc .n{font-weight:800;font-size:20px;margin-top:8px}
.flag{width:22px;height:15px;border-radius:3px;display:inline-block;position:relative;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.flag i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:9px;line-height:1}
.mc{background:var(--card);border-radius:26px;padding:14px;width:168px;flex:none;cursor:pointer}
.mc .tag{font-size:11px;padding:4px 9px;border-radius:20px;display:inline-block;font-weight:600}
/* worker list cards (ref 1) */
.wc{background:var(--card);border-radius:var(--r);margin-bottom:12px;overflow:hidden;cursor:pointer}
.wc .top{padding:18px 18px 14px}
.wc h3{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.wc h3 small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}
.badge{border-radius:30px;padding:7px 12px;font-size:12.5px;white-space:nowrap;font-weight:500}
.badge.cream{background:#F1ECDF}.badge.lilac{background:var(--lilac)}.badge.grey{background:#D6D3CC}.badge.lime{background:var(--lime)}.badge.gold{background:var(--gold)}
.cols{display:flex;margin-top:14px}
.cols>div{flex:1;padding-right:10px;border-right:1px solid var(--line);margin-right:12px;min-width:0}
.cols>div:nth-child(2){flex:1.5}.cols>div:last-child{border:0;margin:0;flex:1.2}
.cols .l{font-size:12px;color:#B9B4A8}
.cols .v{font-size:17px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc .bot{border-top:1px solid var(--line);padding:12px 18px 14px;display:flex;align-items:center;gap:10px}
.wc .bot .nm{font-size:14px;font-weight:600}
.wc .bot .em{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.act{width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.act.on{color:var(--red)}
.act.on svg{fill:var(--red)}
.act.del{color:var(--red)}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{border-radius:30px;padding:9px 15px;font-size:13px;background:var(--card);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1.5px solid transparent;font-weight:500}
.chip.on{background:#161616;color:#fff}
.chip.sm{padding:6px 11px;font-size:12px}
.tabsx{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px;scrollbar-width:none}
.tabsx::-webkit-scrollbar{display:none}
.tabx{padding:10px 16px;border-radius:30px;font-weight:700;font-size:14px;background:var(--card);white-space:nowrap;cursor:pointer}
.toggles{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tg{font-size:12px;padding:7px 12px;border-radius:30px;border:1.5px dashed #C9C3B6;cursor:pointer}
.tg.on{border-style:solid;border-color:#161616;background:#161616;color:#fff}
.title{font-size:32px;font-weight:800;letter-spacing:-.8px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 20px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
/* detail */
.dhead{border-radius:0 0 40px 40px;padding:10px 20px 26px;text-align:center}
.dhead .name{font-size:28px;font-weight:800;margin-top:10px;letter-spacing:-.5px}
.rpill{display:inline-block;background:rgba(255,255,255,.75);border-radius:30px;padding:7px 16px;font-weight:600;margin-top:8px;font-size:14px}
.kv{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.kv span{background:#fff;border-radius:30px;padding:8px 13px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.box{background:var(--card);border-radius:26px;padding:18px;margin-top:14px}
.box h4{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.box ul{padding-left:18px;font-size:14px;line-height:1.75}
.inf{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.inf .l{font-size:12px;color:var(--muted)}.inf .v{font-size:14px;font-weight:600;margin-top:2px}
.vf{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.vf:last-child{border:0}
.vf .ok{width:24px;height:24px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
.vf .no{background:#EEE9DE;color:var(--muted)}
.vf svg{width:14px;height:14px}
.stage{border-radius:26px;padding:16px 18px;margin-top:-18px;position:relative}
.stage:first-child{margin-top:0}
.stage .s{font-size:11px;background:#161616;color:#fff;border-radius:20px;padding:4px 10px;display:inline-block}
.stage .t{font-size:22px;font-weight:800;margin-top:8px;letter-spacing:-.4px}
.stage p{font-size:12px;opacity:.85;margin:4px 0 14px;line-height:1.5}
.stage .st{position:absolute;right:16px;top:16px;width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center}
.review{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.55}
.review:last-child{border:0}
.bbar{position:absolute;left:0;right:0;bottom:0;padding:14px 20px 26px;background:var(--bg);box-shadow:0 -10px 20px -12px rgba(0,0,0,.18);display:flex;gap:10px;z-index:20}
.bigbtn{flex:1;background:#161616;color:#fff;border-radius:40px;height:58px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.bigbtn.lime{background:var(--lime);color:#161616}
.sqbtn{width:58px;height:58px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
/* nav */
.nav{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#161616;border-radius:46px;padding:7px;display:flex;gap:6px;z-index:25;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.nav button{width:52px;height:52px;border-radius:50%;background:#2A2A2A;color:#bbb;display:grid;place-items:center;position:relative}
.nav button.on{background:var(--gold);color:#161616}
.nav button.add{background:var(--lime);color:#161616}
.nav .cnt{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:10px;display:grid;place-items:center;padding:0 4px;font-weight:700}
/* post form (ref 2) */
.formwrap{background:var(--red);border-radius:36px 36px 0 0;padding:24px 20px 140px;min-height:100%;color:#161616;margin-top:8px}
.formwrap h2{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.fl{font-weight:700;font-size:15px;margin:18px 0 8px}
.fi{width:100%;border:1.5px solid rgba(0,0,0,.18);background:rgba(255,255,255,.12);border-radius:40px;padding:15px 20px;outline:none;font-size:15px}
.fi::placeholder{color:rgba(0,0,0,.45)}
textarea.fi{border-radius:24px;min-height:90px;resize:none}
.fi:focus{border-color:#161616;background:rgba(255,255,255,.25)}
.formwrap .chip{background:#161616;color:#ddd}
.formwrap .chip.on{background:#fff;color:#161616}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1.5px solid rgba(0,0,0,.18);border-radius:40px;padding:6px}
.stepper button{width:40px;height:40px;border-radius:50%;background:#161616;color:#fff;font-size:20px}
.stepper b{font-size:18px}
/* chats (ref 4) */
.cb{border-radius:34px;padding:14px 16px;display:flex;gap:12px;margin-top:-6px;position:relative;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.06)}
.cb:first-child{margin-top:0}
.cb .msg{font-size:12.5px;line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cb .un{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:#161616;color:#fff;font-size:11px;display:grid;place-items:center}
.cb .tail{position:absolute;bottom:-9px;width:18px;height:18px;transform:rotate(45deg);border-radius:3px}
/* conversation */
.chead{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);position:sticky;top:0;z-index:5}
.msgs{padding:10px 16px}
.m{max-width:78%;padding:12px 15px;border-radius:22px;font-size:14px;line-height:1.45;margin:8px 0}
.m.them{background:var(--card);border-bottom-left-radius:6px}
.m.me{background:#161616;color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.m .tr{font-size:12px;opacity:.6;border-top:1px dashed currentColor;margin-top:8px;padding-top:6px}
.m .tm{font-size:10px;opacity:.5;margin-top:4px;text-align:right}
.inputbar{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 24px;background:var(--bg);display:flex;gap:8px;align-items:center;z-index:20}
.inputbar input{flex:1;background:var(--card);border:0;border-radius:30px;padding:15px 18px;outline:none;font-size:15px}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:var(--bg);position:absolute;left:0;right:0;bottom:86px;z-index:20;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
/* jobs (ref 1) */
.seg{display:flex;background:var(--card);border-radius:30px;padding:4px;margin:6px 0 14px}
.seg button{flex:1;padding:10px;border-radius:26px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:#161616;color:#fff}
/* me (ref 6) */
.ccard{border-radius:30px;padding:20px;background:linear-gradient(135deg,#D9EE7A,#9CC437);position:relative;overflow:hidden}
.ccard:after{content:"JobPaw";position:absolute;right:-6px;bottom:-14px;font-size:64px;font-weight:900;opacity:.08;letter-spacing:-2px}
.ccard .cn{font-size:22px;font-weight:800;line-height:1.2;margin-top:10px}
.ccard .row3{display:flex;margin-top:18px;gap:8px}
.ccard .row3 div{flex:1;background:rgba(255,255,255,.4);border-radius:18px;padding:10px}
.ccard .row3 b{font-size:20px;display:block}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{background:var(--card);border-radius:20px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;font-weight:500}
.qa .qi{width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
/* sheet/toast */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:.25s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:34px 34px 0 0;padding:10px 20px 30px;z-index:41;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:85%;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:#CFC8BA;margin:0 auto 14px}
.toast{position:absolute;left:50%;bottom:112px;transform:translate(-50%,20px);max-width:88%;white-space:normal!important;text-align:center;background:#161616;color:#fff;padding:12px 18px;border-radius:30px;font-size:13px;z-index:60;opacity:0;transition:.3s;pointer-events:none;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fade{animation:fd .28s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ivc{background:var(--card);border-radius:22px;padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.datebox{width:54px;height:58px;border-radius:16px;background:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.datebox b{font-size:20px;line-height:1}
.logo{object-fit:cover;background:none!important;width:36px;height:36px;border-radius:12px;background:var(--lime);display:grid;place-items:center;font-weight:900;font-size:18px}
.up{height:150px;border-radius:24px;border:2px dashed #C9C3B6;background:var(--card) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.up.round{width:84px;height:84px;border-radius:50%;flex:none}
.steps{display:flex;gap:6px;flex:1;margin:0 14px}.steps i{flex:1;height:6px;border-radius:6px;background:rgba(0,0,0,.15)}.steps i.on{background:#161616}
.regwrap{background:var(--bg);padding:16px 20px 130px}
.regwrap .fi{background:var(--card);border-color:transparent}.regwrap .fi:focus{border-color:#161616;background:#fff}
.regwrap .stepper{background:var(--card);border-color:transparent}
.consent{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:20px;padding:14px;margin-top:18px;font-size:12.5px;line-height:1.5}
.consent input{width:20px;height:20px;flex:none;accent-color:#161616;margin-top:2px}
@media (max-width:519px){.screen{padding-top:env(safe-area-inset-top)}.nav{bottom:calc(14px + env(safe-area-inset-bottom))}.bbar,.inputbar{padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
.select{appearance:none;background:var(--card);border:0;border-radius:30px;padding:9px 14px;font-size:13px;font-weight:600;outline:none}
.note-y{background:var(--gold);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:6px}details>summary::-webkit-details-marker{display:none}
</style>

<script>
/* ============ ICONS ============ */
const P={

const rolesChips=(ind,cur)=>ind.roles.map((r,k)=>`<span class="chip sm ${(cur?cur===r[0]:k===0)?'on':''}" data-v="${r[0]}" data-en="${r[1]}" onclick="pickOne(this);$('#pTitle').value=this.dataset.v">${r[0]}</span>`).join('');
function fillRoles(id){$('#pRole').innerHTML=rolesChips(IND.find(i=>i.id===id));$('#pTitle').value=''}
function stp(d){const b=$('#pN');b.textContent=Math.max(1,+b.textContent+d)}
function savePost(id){
  const role=$('#pRole .chip.on');const title=$('#pTitle').value.trim()||role?.dataset.v;
  const lo=$('#pLo').value.replace(/\D/g,''),hi=$('#pHi').value.replace(/\D/g,'');
  if(!title){toast('请填写岗位名称');return} if(!lo||!hi){toast('请填写月薪范围');return}
  const fmt=n=>(+n).toLocaleString('en-US');
  const opts=[...document.querySelectorAll('#pOpt .chip.on')].map(c=>c.dataset.v);
  const data={title,en:role?.dataset.en||'',ind:$('#pInd .chip.on').dataset.v,exp:$('#pExp').value,sal:fmt(lo)+'–'+fmt(hi),city:$('#pCity .chip.on').textContent,
    n:+$('#pN').textContent,nats:[...document.querySelectorAll('#pNat .chip.on')].map(c=>c.dataset.v),zh:opts.includes('zh'),stay:opts.includes('stay'),desc:$('#pDesc').value};
  if(!data.nats.length)data.nats=['GH'];
  data.descEn=null;
  if(id){const j=S.jobs.find(j=>j.id===id);Object.assign(j,data);if(j.dbid)dbSafe(()=>DB.q('jobs?id=eq.'+j.dbid,{method:'PATCH',body:JSON.stringify(jobRow(j))}));toast('岗位已更新')}
  else{const j={id:Date.now(),apps:0,status:'open',owner:'me',company:MYCO,...data};S.jobs.unshift(j);toast('发布成功，已推送给匹配工人');
    dbSafe(async()=>{const r=await DB.q('rpc/post_job',{method:'POST',body:JSON.stringify({p_data:jobRow(j).data})});j.dbid=r;toast('已提交，平台审核通过后工人可见')})}

function inviteSheet(id){
  const w=W(id);const jobs=S.jobs.filter(j=>j.status==='open');const d=new Date();

function sendInvite(id){
  const w=W(id);const job=$('#iJob .chip.on').textContent,dc=$('#iDate .chip.on'),time=$('#iTime .chip.on').textContent,way=$('#iWay .chip.on').textContent;
  const mo=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][dc.dataset.m-1];
  const wayEn={'到厂面试':'on-site interview','视频面试':'video interview','电话面试':'phone interview','直接试工':'trial work'}[way];
  S.interviews.unshift({wid:id,job,date:`${dc.dataset.m}月${dc.dataset.d}日`,d:dc.dataset.d,mo,time,way,place:w.city});
  let c=S.chats.find(c=>c.wid===id);if(!c){c={wid:id,unread:0,color:'#CFE36B',msgs:[]};S.chats.unshift(c)}
  c.msgs.push({me:true,o:`您好 ${w.name}，邀请您 ${dc.dataset.m}月${dc.dataset.d}日 ${time} 参加「${job}」岗位的${way}，请确认是否能来。`,t:`Hello ${w.name}, you are invited for a ${wayEn} for the ${job} position on ${mo} ${dc.dataset.d} at ${time}. Please confirm.`,tm:nowT()});
  closeSheet();toast('面试邀请已发送');
}

function resizeImg(f,max){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f)})}
function pickPhoto(k){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;S.reg[k]=await resizeImg(f,k==='photo'?360:1000);render(false)};i.click()}

  const st=LS.get('state',null);if(!st)return;

/* ---------- 通用：开关、分组标题 ---------- */

const pageHdr=title=>`<div class="hdr"><button class="icbtn" onclick="back()">${ic('back')}</button><b style="font-size:17px">${title}</b><span style="width:44px"></span></div>`;

  function fallback(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('复制失败，请长按文字复制')}ta.remove()}}

async function nativeBuild(){if(UPD.native!==null)return UPD.native;try{const i=await window.Capacitor.Plugins.App.getInfo();UPD.native=+i.build||0}catch(e){UPD.native=0}return UPD.native}
const notesOf=v=>{const n=v.notes||{};return n[S.lang]||n.en||n.zh||[]};
const updNotes=v=>`<div class="xs muted b" style="margin:14px 0 6px">${t('upd_new')}</div><ul style="margin:0;padding-left:20px;line-height:1.7;font-size:14px">${notesOf(v).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
async function checkUpdate(manual){
  if(UPD.busy)return;UPD.busy=true;
  try{
    const r=await fetch('/version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const v=await r.json();UPD.remote=v;
    const nb=isNative()?await nativeBuild():0;
    // 1) 需要新安装包（原生外壳有变化时才会出现）
    if(isNative()&&v.minNative&&nb&&nb<v.minNative){showUpd(v,'apk');return}
    // 2) 网页内容有新版本：一键刷新即完成更新
    if((+v.build||0)>APP_BUILD){
      if(!manual&&!v.force){const d=LS.get('updLater',null);if(d&&d.b===v.build&&Date.now()-d.t<6*3600e3)return}
      showUpd(v,'web');return}
    if(manual)toast(t('upd_latest')+' · v'+APP_VER);
  }catch(e){if(manual)toast(t('upd_fail'))}
  finally{UPD.busy=false;if(S.view==='settings'||S.view==='w_me')render(false)}
}
function showUpd(v,kind){
  const force=!!v.force||kind==='apk'&&v.forceNative;
  openSheet(`<div class="row gap" style="align-items:center"><span style="width:52px;height:52px;border-radius:16px;background:var(--lime);display:grid;place-items:center;font-size:24px;font-weight:900">H</span>
   <div><div class="b" style="font-size:20px">${t('upd_title')}</div><div class="sm muted">v${APP_VER} → <b style="color:var(--ink)">v${esc(v.version)}</b>${v.date?' · '+esc(v.date):''}</div></div></div>
   ${updNotes(v)}
   ${kind==='apk'?`<div class="note-y" style="margin-top:14px">${t('upd_apk_tip')}</div>`:''}
   ${force?`<div class="xs" style="margin-top:10px;color:var(--red)">${t('upd_force')}</div>`:''}
   <div class="row gap" style="margin-top:18px">${force?'':`<button class="bigbtn" style="background:var(--card);color:#161616;flex:0 0 34%" onclick="updLater(${+v.build||0})">${t('upd_later')}</button>`}
   <button class="bigbtn" style="flex:1" onclick="${kind==='apk'?'doApk()':'doUpdate()'}">${kind==='apk'?t('upd_apk'):t('upd_now')}</button></div>`);
  $('#sheet').dataset.force=force?'1':'0'
}
function updLater(b){LS.set('updLater',{b,t:Date.now()});closeSheet()}
async function doUpdate(){
  LS.set('updFrom',APP_VER);persist&&persist();
  try{if('serviceWorker' in navigator){const rg=await navigator.serviceWorker.getRegistration();if(rg){await rg.update();if(rg.waiting)rg.waiting.postMessage('skip')}}
      if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}
  location.replace(location.pathname+'?v='+(UPD.remote?UPD.remote.build:Date.now()));
}
function doApk(){const u=(UPD.remote&&UPD.remote.apk)||'https://github.com/debaoqi/hiregh/releases/latest/download/JobPaw.apk';
  if(isNative()){location.href=u}else window.open(u,'_blank')}
/* 强制更新时，关闭弹窗会再次弹出 */
const _open0=openSheet;openSheet=function(h){$('#sheet').dataset.force='0';return _open0(h)};
const _close0=closeSheet;closeSheet=function(){if($('#sheet').dataset.force==='1')return;return _close0()};
/* 更新完成后，告诉用户更新了什么（只显示一次） */
(function afterUpdate(){const from=LS.get('updFrom',null);const seen=LS.get('seenVer',null);LS.set('seenVer',APP_VER);
  if(!from||from===APP_VER)return;LS.set('updFrom',null);
  setTimeout(async()=>{let v=null;try{v=await (await fetch('/version.json?t='+Date.now(),{cache:'no-store'})).json()}catch(e){}
    openSheet(`<div class="b" style="font-size:20px">✓ ${t('upd_done')} v${APP_VER}</div>${v&&v.version===APP_VER?updNotes(v):''}<button class="bigbtn" style="width:100%;margin-top:18px" onclick="closeSheet()">${t('ok')}</button>`)},600)})();
/* 何时检查：启动后、回到前台、每 30 分钟 */
if(location.protocol==='https:'){
  setTimeout(()=>checkUpdate(false),2500);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate(false)});
  setInterval(()=>checkUpdate(false),30*60e3);
  try{window.Capacitor&&window.Capacitor.Plugins.App&&window.Capacitor.Plugins.App.addListener('resume',()=>checkUpdate(false))}catch(e){}
}
const hasUpd=()=>UPD.remote&&(+UPD.remote.build||0)>APP_BUILD;
const updRow=()=>`<div class="li" style="cursor:pointer" onclick="${hasUpd()?"showUpd(UPD.remote,'web')":'checkUpdate(true)'}">${ic('download')}<div style="flex:1"><div class="b" style="font-size:15px">${t('upd_check')}</div><div class="xs muted">v${APP_VER}${hasUpd()?` → <b style="color:var(--red)">v${esc(UPD.remote.version)}</b>`:''}</div></div>${hasUpd()?'<span style="width:9px;height:9px;border-radius:50%;background:var(--red)"></span>':'<span class="muted">›</span>'}</div>`;
P.download='<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>';
const _vset=V.settings;V.settings=()=>_vset().replace(/<div class="li"><div style="flex:1"><div class="b" style="font-size:15px">版本<\/div>.*?<\/div><\/div><\/div>/,'').replace('<div class="box"><div class="li" style="cursor:pointer" onclick="openSheet(','<div class="box">'+updRow()+'<div class="li" style="cursor:pointer" onclick="openSheet(');
const _vme2=V.w_me;V.w_me=()=>_vme2().replace(`<div class="li" style="cursor:pointer" onclick="toWelcome()">`,updRow()+`<div class="li" style="cursor:pointer" onclick="toWelcome()">`);

</script>
<script>
/* ================= v1.6 · 资料永久保存 + 云端同步 + 有照片优先 ================= */
Object.assign(T,{
 st_ok:['Profile approved','Hồ sơ đã được duyệt','档案已通过审核'],
 st_rej:['Please update your profile','Vui lòng cập nhật hồ sơ','资料需修改'],
 st_rej_tip:['Reason','Lý do','原因'],
 draft_back:['Your unfinished form was restored','Đã khôi phục biểu mẫu chưa xong','已恢复你上次未填完的资料'],
});
/* 1) 尽量让系统不清理本机数据 */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* 2) 本机保存：除了已保存的档案，还记住身份（工人/企业）和没填完的表单 */
function regWorth(r){return r&&!r.editing&&(r.name||r.phone||r.photo||r.idPhoto||r.step>1)}
const _persist1=persist;
persist=function(){_persist1();
  const st2={mode:S.mode,reg:regWorth(S.reg)?S.reg:null,me:S.me||null,myToken:S.myToken||null};
  try{localStorage.setItem('hiregh_state2',JSON.stringify(st2))}catch(e){
    // 空间不够时，先去掉表单里的大图再存，保证文字资料不丢
    try{const r=st2.reg?{...st2.reg,idPhoto:null,permit:null,health:null}:null;localStorage.setItem('hiregh_state2',JSON.stringify({...st2,reg:r}))}catch(e2){}
  }};
(function restore2(){
  const st2=LS.get('state2',null);if(!st2)return;
  // 主存档丢失时，用备份恢复工人档案
  if(!S.me&&st2.me){S.me=st2.me;if(!WORKERS.some(w=>w.id===S.me.id))WORKERS.unshift(S.me)}
  if(!S.myToken&&st2.myToken)S.myToken=st2.myToken;
  if(st2.mode==='wk'){S.mode='wk';S.hist=[];
    if(S.me){S.view='w_home'}else if(st2.reg){S.reg={...newReg(),...st2.reg};S.view='w_reg';setTimeout(()=>toast(t('draft_back')),800)}
    else{S.reg=newReg();S.view='w_reg'}
    render(true)}
  else if(st2.mode==='emp'){S.mode='emp';tab('home')}
})();

/* 3) 云端同步：用注册时保存的凭证，把云端的最新档案和审核结果拉回手机 */
async function syncMe(){
  if(!DB.on||!S.me||!S.me.dbid||!S.myToken)return;
  try{
    const r=await DB.q('rpc/get_my_worker',{method:'POST',body:JSON.stringify({p_id:S.me.dbid,p_token:S.myToken})});
    if(!r||!r.data)return;
    const keep={id:S.me.id,dbid:S.me.dbid};
    const me={...S.me,...r.data,...keep,status:r.status,review:r.review||null,pending:r.status!=='approved'};
    if(!me.photo&&S.me.photo)me.photo=S.me.photo;
    S.me=me;const i=WORKERS.findIndex(w=>w.id===me.id);if(i>=0)WORKERS[i]=me;else WORKERS.unshift(me);
    persist();if(S.mode==='wk')render(false);
  }catch(e){}
}
setTimeout(syncMe,1500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncMe()});

/* 审核状态显示：审核中 / 已通过 / 需修改 */
function statusFix(h){const m=S.me;if(!m||!m.status||m.status==='pending')return h;
  const pend=t('verify_pending');
  if(m.status==='approved')return h.split(pend).join(t('st_ok')).replace(/#161616;color:var\(--lime\)/,'var(--lime);color:#161616');
  if(m.status==='rejected')return h.split(pend).join(t('st_rej')+(m.review&&(m.review.reason||m.review.note)?' · '+esc(m.review.reason||m.review.note):''));
  return h}
const _vwh=V.w_home;V.w_home=()=>statusFix(_vwh());
const _vwm=V.w_me;V.w_me=()=>statusFix(_vwm());

/* 4) 填表时不打断：更新提示等表单提交后再弹出 */
const FORM_VIEWS=['w_reg','post','contract'];
const _showUpd1=showUpd;
showUpd=function(v,kind){
  if(kind==='web'&&!v.force&&FORM_VIEWS.includes(S.view)){UPD.deferred=[v,kind];return}
  UPD.deferred=null;return _showUpd1(v,kind)};
const _render6=render;
render=function(top){_render6(top);
  if(UPD.deferred&&!FORM_VIEWS.includes(S.view)){const d=UPD.deferred;UPD.deferred=null;setTimeout(()=>showUpd(d[0],d[1]),400)}};

/* 5) 人才库：有照片的排在前面（其余顺序不变） */
const hasPhoto=w=>!!(w&&w.photo&&/^(data:image\/|https:\/\/)/.test(w.photo));
const _filtered6=filtered;
filtered=function(){return _filtered6().sort((a,b)=>hasPhoto(b)-hasPhoto(a))};

</script>
<script>
/* ================= v1.7 · 企业名称 + 中英自动翻译 + 企业定位（谷歌地图） ================= */
Object.assign(T,{
 co_loc:['Company location','Company location','企业位置'],
 open_map:['Open in Google Maps','Open in Google Maps','在谷歌地图中打开'],
 directions:['Directions','Directions','导航前往'],
 approx_loc:['Approximate location (city)','Approximate location (city)','城市大致位置'],
});
/* ---------- 企业资料（本机保存，发布岗位时带上） ---------- */
const CITY_LL={'阿克拉':[5.6037,-0.1870],'特马':[5.6698,-0.0166],'库马西':[6.6885,-1.6244],'塔科拉迪':[4.8845,-1.7554],'卡索阿':[5.5340,-0.4168],'塔马利':[9.4008,-0.8393],'奥布阿西':[6.2023,-1.6704],'科福里杜阿':[6.0940,-0.2591]};
S.company=Object.assign({name:'鑫源建材（加纳）有限公司',en:'Xinyuan Building Materials (Ghana) Co., Ltd.',
  loc:{lat:5.6742464,lng:0.0122904,addr:'Tema Heavy Industrial Area, Tema, Ghana',approx:true}},LS.get('company',{}));
function saveCompany(){LS.set('company',S.company);
  // 同步到本企业所有岗位（位置跟随企业的岗位一起更新）
  S.jobs.filter(j=>j.owner==='me').forEach(j=>{j.company=S.company.name;j.companyEn=S.company.en;if(!j.loc||j.locFromCo)j.loc={...S.company.loc},j.locFromCo=true});
  persist()}
S.jobs.filter(j=>j.owner==='me').forEach(j=>{j.company=S.company.name;j.companyEn=S.company.en;if(!j.loc){j.loc={...S.company.loc};j.locFromCo=true}});
S.jobs.filter(j=>j.owner!=='me'&&!j.loc&&CITY_LL[j.city]).forEach(j=>{const c=CITY_LL[j.city];j.loc={lat:c[0],lng:c[1],addr:(CITIES.find(x=>x[0]===j.city)||[,j.city])[1]+', Ghana',approx:true}});
const coT=j=>S.lang==='zh'?(j.company||''):(j.companyEn||j.company||'');
const coShort=()=>S.company.name.replace(/（.*?）|\(.*?\)|有限公司|有限责任公司|公司/g,'').trim()||S.company.name;

/* ---------- 中文 → 英文自动翻译 ---------- */
async function zh2en(text){
  text=(text||'').trim();if(!text)return '';if(!/[一-龥]/.test(text))return text;
  const tmo=()=>{const c=new AbortController();setTimeout(()=>c.abort(),6000);return c.signal};
  try{const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=en&dt=t&q='+encodeURIComponent(text.slice(0,1500)),{signal:tmo()});
    const j=await r.json();const out=(j[0]||[]).map(x=>x[0]).join('');if(out)return out}catch(e){}
  try{const r=await fetch('https://api.mymemory.translated.net/get?langpair=zh-CN|en&q='+encodeURIComponent(text.slice(0,450)),{signal:tmo()});
    const out=(await r.json()).responseData.translatedText;if(out&&!/MYMEMORY|QUERY LENGTH/i.test(out))return out}catch(e){}
  return ''}
let _trT=null;
function autoEn(srcId,dstId){const src=$('#'+srcId),dst=$('#'+dstId);if(!src||!dst)return;
  if(dst.dataset.manual==='1')return;clearTimeout(_trT);
  _trT=setTimeout(async()=>{const v=src.value;if(!v.trim()){dst.value='';return}dst.placeholder='翻译中… Translating…';
    const en=await zh2en(v);if(src.value===v&&dst.dataset.manual!=='1'){dst.value=en||dst.value;dst.placeholder='English name'}},600)}

/* ---------- 地图 ---------- */
const mapQ=l=>l&&l.lat!=null?`${l.lat},${l.lng}`:encodeURIComponent((l&&l.addr)||'Ghana');
const mapEmbed=l=>`https://maps.google.com/maps?q=${mapQ(l)}&z=${l&&l.approx?13:16}&hl=${S.lang==='zh'?'zh-CN':'en'}&output=embed`;
const mapLink=l=>`https://www.google.com/maps/search/?api=1&query=${mapQ(l)}`;
const mapDir=l=>`https://www.google.com/maps/dir/?api=1&destination=${mapQ(l)}`;
function openExt(u){if(isNative())location.href=u;else window.open(u,'_blank')}
const mapFrame=(l,h=180)=>l&&(l.lat!=null||l.addr)?`<iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${mapEmbed(l)}" style="display:block;width:100%;height:${h}px;border:0;border-radius:16px;background:#E4DFD3"></iframe>`:`<div class="empty sm" style="height:${h}px;display:grid;place-items:center;border-radius:16px;background:#E4DFD3">尚未设置位置</div>`;
const LOCS={};   // 正在编辑的位置：co = 企业资料，post = 发布岗位
function locBox(ctx){const l=LOCS[ctx];return `<div id="locBox_${ctx}">${mapFrame(l)}
  <div class="sm" style="margin-top:8px;line-height:1.5">${ic('pin',14)} ${l?esc(l.addr||''):'—'}${l&&l.lat!=null?` <span class="xs muted">(${(+l.lat).toFixed(5)}, ${(+l.lng).toFixed(5)})</span>`:''}${l&&l.approx?` <span class="badge gold" style="font-size:11px">大致位置</span>`:''}</div>
  <div class="chips wrap" style="margin-top:8px"><span class="chip sm on" onclick="locNow('${ctx}')">${ic('pin',14)}自动定位当前位置</span><span class="chip sm" onclick="locSearch('${ctx}')">搜索地址 / 粘贴地图链接</span>${ctx==='post'?`<span class="chip sm" onclick="setLoc('post',{...S.company.loc},true)">用企业地址</span>`:''}${l?`<span class="chip sm" onclick="openExt(mapLink(LOCS['${ctx}']))">谷歌地图查看</span>`:''}</div></div>`}
function setLoc(ctx,l,fromCo){LOCS[ctx]=l;if(ctx==='post')LOCS.postFromCo=!!fromCo;const b=$('#locBox_'+ctx);if(b)b.outerHTML=locBox(ctx)}
async function revGeo(lat,lng){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=17&accept-language=en`);const j=await r.json();return j.display_name||''}catch(e){return ''}}
function locNow(ctx){
  if(!navigator.geolocation){toast('此设备不支持定位，请搜索地址');return}
  toast('正在定位…');
  navigator.geolocation.getCurrentPosition(async p=>{const lat=+p.coords.latitude.toFixed(6),lng=+p.coords.longitude.toFixed(6);
      setLoc(ctx,{lat,lng,addr:'当前位置',approx:false});toast('定位成功');const a=await revGeo(lat,lng);if(a&&LOCS[ctx]&&LOCS[ctx].lat===lat){LOCS[ctx].addr=a;setLoc(ctx,LOCS[ctx],ctx==='post'?false:undefined)}},
    e=>{toast(e.code===1?'没有定位权限：请在手机设置中允许 JobPaw 使用位置，或搜索地址':'定位失败，请到空旷处重试或搜索地址')},
    {enableHighAccuracy:true,timeout:15000,maximumAge:60000})}
function parseLL(s){s=(s||'').trim();let m=s.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||s.match(/^(-?\d{1,2}\.\d+)\s*[, ]\s*(-?\d{1,3}\.\d+)$/);
  return m?{lat:+m[1],lng:+m[2]}:null}
function locSearch(ctx){openSheet(`<div class="b" style="font-size:20px">设置位置</div>
  <div class="sm muted" style="margin:6px 0 12px;line-height:1.6">输入英文地址或地名（如 Tema Industrial Area、Spintex Road Accra），或粘贴谷歌地图分享链接 / 坐标（如 5.6742, 0.0123）。</div>
  <input class="fi" id="locQ" placeholder="地址 / 地图链接 / 坐标" style="background:var(--card);border-color:transparent">
  <button class="bigbtn" style="width:100%;margin-top:12px" onclick="doLocSearch('${ctx}')">搜索</button><div id="locRes" style="margin-top:10px"></div>`);setTimeout(()=>$('#locQ')&&$('#locQ').focus(),200)}
async function doLocSearch(ctx){const q=$('#locQ').value.trim();if(!q)return;
  const ll=parseLL(q);if(ll){closeSheet();setLoc(ctx,{...ll,addr:await revGeo(ll.lat,ll.lng)||q,approx:false});toast('位置已设置');return}
  if(/goo\.gl|maps\.app/.test(q)){$('#locRes').innerHTML='<div class="sm" style="color:var(--red)">短链接无法识别：请在谷歌地图里长按位置，复制坐标后粘贴。</div>';return}
  $('#locRes').innerHTML='<div class="sm muted">搜索中…</div>';
  try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&countrycodes=gh&limit=6&accept-language=en&q='+encodeURIComponent(q));const l=await r.json();
    window.__locR=l;$('#locRes').innerHTML=l.length?l.map((x,k)=>`<div class="li" style="cursor:pointer" onclick="pickLocRes('${ctx}',${k})">${ic('pin',16)}<span class="sm">${esc(x.display_name)}</span></div>`).join(''):'<div class="sm muted">没有找到，请换英文地名，或粘贴坐标。</div>'}
  catch(e){$('#locRes').innerHTML='<div class="sm" style="color:var(--red)">网络错误，请稍后再试</div>'}}
function pickLocRes(ctx,k){const x=window.__locR[k];closeSheet();setLoc(ctx,{lat:+(+x.lat).toFixed(6),lng:+(+x.lon).toFixed(6),addr:x.display_name,approx:false});toast('位置已设置')}

/* ---------- 企业资料编辑页（我的 → 企业信息） ---------- */
V.company=()=>{if(!LOCS.coInit){LOCS.co=S.company.loc?{...S.company.loc}:null;LOCS.coInit=1}
 return pageHdr('企业信息')+`<div class="pad">
  <div class="fl" style="margin-top:0">企业名称（中文）</div><input class="fi" id="coName" value="${esc(S.company.name)}" oninput="autoEn('coName','coEn')" placeholder="例如：鑫源建材（加纳）有限公司">
  <div class="fl">英文名称 <span class="xs muted">· 自动翻译，可修改</span></div><input class="fi" id="coEn" value="${esc(S.company.en)}" oninput="this.dataset.manual='1'" placeholder="English name">
  <div class="fl">企业位置 <span class="xs muted">· 工人可在谷歌地图中看到并导航</span></div>${locBox('co')}
 </div><div class="bbar"><button class="bigbtn" onclick="saveCo()">保存企业信息</button></div>`};
async function saveCo(){const name=$('#coName').value.trim();if(!name){toast('请填写企业名称');return}
  let en=$('#coEn').value.trim();if(!en)en=await zh2en(name)||name;
  S.company={...S.company,name,en,loc:LOCS.co||S.company.loc};LOCS.coInit=0;saveCompany();toast('企业信息已保存');back()}

/* 1) 读取云端数据时不使用缓存，保证拿到的是最新数据 */
const _q9=DB.q;DB.q=function(path,opt={}){return _q9.call(DB,path,{cache:'no-store',...opt})};

/* 2) 企业端只显示审核通过的工人：自己手机上未通过/被删除的档案不进入人才库 */
const visW=w=>!(w.self&&w.status!=='approved');

/* 3) 同步：把云端“已审核通过”的工人和岗位与手机对齐（删除、停用、修改都会生效） */
const isRemoteJob=j=>j.id>=100000&&j.id<1e9;
let _syncAt=0,_syncing=false;
async function syncDB(force){
  if(!DB.on||_syncing)return;if(!force&&Date.now()-_syncAt<8000)return;_syncing=true;
  try{
    const [ws,js]=await Promise.all([DB.q('workers?select=id,data&order=id.asc&limit=2000'),DB.q('jobs?select=id,data&order=id.asc&limit=1000')]);
    if(!Array.isArray(ws)||!Array.isArray(js))return;
    let changed=false;const meId=S.me&&S.me.id;
    // 工人：云端没有了（被删除/停用/驳回）就从手机上移除
    const wIds=new Set(ws.map(r=>100000+r.id));
    for(let i=WORKERS.length-1;i>=0;i--){const w=WORKERS[i];if(w.id>=100000&&w.id!==meId&&!wIds.has(w.id)){WORKERS.splice(i,1);S.saved.delete(w.id);changed=true}}
    ws.forEach(r=>{const id=100000+r.id;if(id===meId)return;const nw={...r.data,id,dbid:r.id,self:false};delete nw.pending;
      const i=WORKERS.findIndex(w=>w.id===id);if(i<0){WORKERS.unshift(nw);changed=true}else if(JSON.stringify(WORKERS[i])!==JSON.stringify(nw)){WORKERS[i]=nw;changed=true}});
    // 已删除工人的聊天/面试也一并移除，避免点进去出错
    const nC=S.chats.filter(c=>W(c.wid));if(nC.length!==S.chats.length){S.chats=nC;changed=true}
    const nI=S.interviews.filter(x=>W(x.wid));if(nI.length!==S.interviews.length){S.interviews=nI;changed=true}
    // 岗位：云端岗位重新对齐；自己发布的岗位不重复显示
    const mineDb=new Set(S.jobs.filter(j=>j.owner==='me'&&j.dbid&&!isRemoteJob(j)).map(j=>j.dbid));
    const remote=js.filter(r=>!mineDb.has(r.id)).map(r=>({...r.data,id:100000+r.id,dbid:r.id,owner:'other'}));
    const before=JSON.stringify(S.jobs.filter(isRemoteJob));
    if(before!==JSON.stringify(remote)){S.jobs=[...remote.reverse(),...S.jobs.filter(j=>!isRemoteJob(j))];changed=true}
    _syncAt=Date.now();
    if(changed){persist();if(!FORM_VIEWS.includes(S.view)){
      // 正在看的人/岗位已被删除时，返回上一页
      if(S.view==='worker'&&!W(S.params.id))S.hist.length?back():tab('browse');
      else if(S.view==='w_job'&&!S.jobs.find(j=>j.id===S.params.id)){S.view='w_home';S.hist=[];render(true)}
      else render(false)}}
  }catch(e){}finally{_syncing=false}
}

async function syncMe(){
  if(!DB.on||!S.me||!S.me.dbid||!S.myToken)return;
  let r;try{r=await DB.q('rpc/get_my_worker',{method:'POST',body:JSON.stringify({p_id:S.me.dbid,p_token:S.myToken})})}catch(e){return}

    const id=S.me.id;const i=WORKERS.findIndex(w=>w.id===id);if(i>=0)WORKERS.splice(i,1);

  const keep={id:S.me.id,dbid:S.me.dbid};
  const me={...S.me,...r.data,...keep,self:true,status:r.status,review:r.review||null,pending:r.status!=='approved'};
  if(!me.photo&&S.me.photo)me.photo=S.me.photo;
  const was=S.me.status;S.me=me;const i=WORKERS.findIndex(w=>w.id===me.id);if(i>=0)WORKERS[i]=me;else WORKERS.unshift(me);

}

/* 4) 更新逻辑：先完成网页内容更新，安装包更新另行提示，不再互相卡住 */
async function checkUpdate(manual){
  if(UPD.busy)return;UPD.busy=true;
  try{
    const r=await fetch('/version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const v=await r.json();UPD.remote=v;
    if((+v.build||0)>APP_BUILD){
      if(!manual&&!v.force){const d=LS.get('updLater',null);if(d&&d.b===v.build&&Date.now()-d.t<6*3600e3)return}
      showUpd(v,'web');return}
    if(isNative()&&v.minNative){const nb=await nativeBuild();
      if(nb&&nb<v.minNative){if(!manual){const d=LS.get('apkLater',0);if(Date.now()-d<24*3600e3)return}showUpd(v,'apk');return}}
    if(manual)toast(t('upd_latest')+' · v'+APP_VER);
  }catch(e){if(manual)toast(t('upd_fail'))}
  finally{UPD.busy=false;if(S.view==='settings'||S.view==='w_me')render(false)}
}
function updLater(b){LS.set('updLater',{b,t:Date.now()});LS.set('apkLater',Date.now());closeSheet()}

<script>

const EREG_DEF=()=>({step:1,type:'company',name:'',en:'',license:'',contact:'',phone:'',city:0,ind:'ind',needs:{},start:'now',note:'',consent:false});
S.ereg=Object.assign(EREG_DEF(),LS.get('ereg',{}));

function eNext(){const r=S.ereg;
  if(r.step===1){if(!r.name.trim()){toast(r.type==='company'?'请填写企业名称':'请填写你的姓名');return}
    if(r.type==='company'&&!r.contact.trim()){toast('请填写联系人');return}
    if(r.phone.replace(/\D/g,'').length<9){toast('请填写正确的手机号');return}

  if(r.step===3){if(!Object.keys(r.needs).length){toast('请至少选择一个需要招聘的工种');return}if(!r.consent){toast('请先确认招聘承诺');return}return eSubmit()}

V.e_reg=()=>{const r=ereg();const steps=['招聘方信息','所在位置','招聘需求'];
  const head=`<div class="hdr"><button class="icbtn" onclick="eBack()">${ic('back')}</button><b style="font-size:16px">招聘方注册 ${r.step}/3</b><span style="width:44px"></span></div>
   <div class="pad" style="padding-top:0"><div class="row gap6" style="margin:4px 0 14px">${steps.map((s,k)=>`<div style="flex:1"><div style="height:6px;border-radius:6px;background:${k<r.step?'#161616':'#DDD7CA'}"></div><div class="xs ${k+1===r.step?'b':'muted'}" style="margin-top:6px">${s}</div></div>`).join('')}</div>`;
  let body='';
  if(r.step===1){const co=r.type==='company';
    body=`<div class="sm muted" style="line-height:1.6;margin-bottom:12px">注册后才能浏览人才库、发布招工。信息会提交平台认证，并显示在“我的”认证信息中。</div>
    <div class="seg">${[['company','企业 / 单位'],['personal','个人雇主']].map(x=>`<button class="${r.type===x[0]?'on':''}" onclick="eSet('type','${x[0]}',true)">${x[1]}</button>`).join('')}</div>
    ${co?`<div class="fl">企业名称（中文）</div><input class="fi" id="erName" value="${esc(r.name)}" oninput="eSet('name',this.value);autoEn('erName','erEn')" placeholder="例如：鑫源建材（加纳）有限公司">
      <div class="fl">英文名称 <span class="xs muted">· 自动翻译，可修改</span></div><input class="fi" id="erEn" value="${esc(r.en)}" oninput="this.dataset.manual='1';eSet('en',this.value)" onchange="eSet('en',this.value)" placeholder="English name">
      <div class="fl">营业执照 / 注册号 <span class="xs muted">· 选填，填写后更快通过认证</span></div><input class="fi" value="${esc(r.license)}" oninput="eSet('license',this.value)" placeholder="例如：CS123456789">
      <div class="fl">联系人</div><input class="fi" value="${esc(r.contact)}" oninput="eSet('contact',this.value)" placeholder="例如：王经理">`
     :`<div class="fl">你的姓名</div><input class="fi" value="${esc(r.name)}" oninput="eSet('name',this.value)" placeholder="例如：王先生">
      <div class="fl">用工场景</div><div class="chips wrap">${['家庭用工','个体经营','工程项目','农场'].map(x=>`<span class="chip sm ${r.license===x?'on':''}" onclick="eSet('license','${x}',true)">${x}</span>`).join('')}</div>`}
    <div class="fl">手机号</div><input class="fi" inputmode="tel" value="${esc(r.phone)}" oninput="eSet('phone',this.value)" placeholder="+233 或 +86 手机号">
    <div class="fl">所在城市</div><div class="chips wrap">${CITIES.map((c,k)=>`<span class="chip sm ${r.city===k?'on':''}" onclick="eSet('city',${k},true);LOCS.ereg=null">${c[0]}</span>`).join('')}</div>
    ${co?`<div class="fl">主营行业</div><div class="chips wrap">${IND.map(i=>`<span class="chip sm ${r.ind===i.id?'on':''}" onclick="eSet('ind','${i.id}',true)">${i.zh}</span>`).join('')}</div>`:''}`}
  else if(r.step===2){body=`<div class="sm muted" style="line-height:1.6;margin-bottom:12px">设置${r.type==='company'?'企业':'用工'}位置，工人可以在谷歌地图上看到并导航。可自动定位，也可以搜索地址。</div>${locBox('ereg')}`}
  else{const tot=Object.values(r.needs).reduce((a,b)=>a+b,0);
    body=`<div class="sm muted" style="line-height:1.6;margin-bottom:6px">选择需要招聘的工种和人数（可多选）。注册后可以随时发布具体岗位。</div>
    ${tot?`<div class="box" style="margin-top:8px;padding:12px 14px"><b class="sm">已选 ${Object.keys(r.needs).length} 个工种，共 ${tot} 人</b><div class="chips wrap" style="margin-top:8px">${Object.entries(r.needs).map(([k,n])=>`<span class="chip sm on">${k} × ${n}</span>`).join('')}</div></div>`:''}
    ${IND.map(i=>`<div style="margin-top:12px"><div class="row gap6 b sm" style="margin-bottom:8px"><i style="width:10px;height:10px;border-radius:50%;background:${i.color};display:inline-block"></i>${i.zh}</div>
      <div class="chips wrap">${i.roles.map(x=>{const n=r.needs[x[0]]||0;return n?`<span class="chip sm on" style="padding-right:4px">${x[0]}<span style="display:inline-flex;align-items:center;gap:6px;margin-left:8px"><b onclick="event.stopPropagation();eNeed('${x[0]}',-1)" style="width:22px;height:22px;border-radius:50%;background:#fff;color:#161616;display:grid;place-items:center">−</b>${n}<b onclick="event.stopPropagation();eNeed('${x[0]}',1)" style="width:22px;height:22px;border-radius:50%;background:#fff;color:#161616;display:grid;place-items:center">+</b></span></span>`:`<span class="chip sm" onclick="eNeed('${x[0]}',1)">${x[0]}</span>`}).join('')}</div></div>`).join('')}
    <div class="fl">期望到岗</div><div class="chips wrap">${[['now','尽快'],['w1','1周内'],['m1','1个月内']].map(o=>`<span class="chip sm ${r.start===o[0]?'on':''}" onclick="eSet('start','${o[0]}',true)">${o[1]}</span>`).join('')}</div>
    <div class="fl">补充说明 <span class="xs muted">· 选填</span></div><textarea class="fi" oninput="eSet('note',this.value)" placeholder="例如：包住宿、需要会中文、长期用工…">${esc(r.note)}</textarea>

  return head+body+`</div><div class="bbar"><button class="bigbtn" style="width:100%" onclick="eNext()">${r.step<3?'下一步':'提交注册'}</button></div>`};

async function eSubmit(){const r=S.ereg;const btn=document.querySelector('.bbar .bigbtn');if(btn){btn.disabled=true;btn.textContent='提交中…'}
  const co=r.type==='company';let en=r.en.trim();if(co&&!en)en=await zh2en(r.name)||r.name;
  const loc=LOCS.ereg||(()=>{const c=CITY_LL[CITIES[r.city][0]];return {lat:c[0],lng:c[1],addr:CITIES[r.city][1]+', Ghana',approx:true}})();
  const needs=Object.entries(r.needs).map(([role,n])=>({role,n}));
  const token=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36))+Math.random().toString(36).slice(2);
  S.company={type:r.type,name:r.name.trim(),en:co?en:r.name.trim(),license:r.license,contact:co?r.contact.trim():r.name.trim(),phone:r.phone.trim(),
    city:CITIES[r.city][0],ind:co?r.ind:'',loc,needs,start:r.start,note:r.note,registered:true,status:'pending',regAt:new Date().toISOString(),token};
  // 新账号：清空演示用的“我的岗位 / 聊天 / 面试”，从零开始
  S.jobs=S.jobs.filter(j=>!(j.owner==='me'&&j.id<1000));S.chats=[];S.interviews=[];S.saved=new Set();
  saveCompany();LS.set('ereg',null);S.ereg=EREG_DEF();LOCS.ereg=null;
  if(DB.on){const d=companyRow();const id=await dbSafe(()=>DB.q('rpc/register_employer',{method:'POST',body:JSON.stringify({p_data:{...d,_token:token}})}));if(id){S.company.dbid=id;LS.set('company',S.company)}}
  S.mode='emp';tab('home');setTimeout(()=>openSheet(`<div class="b" style="font-size:20px">注册成功</div><p class="sm" style="line-height:1.7;margin:8px 0 0">现在可以浏览人才库、发布招工。平台会在 1 个工作日内完成认证，认证结果显示在“我的”中。</p><button class="bigbtn" style="width:100%;margin-top:16px" onclick="closeSheet();go('post')">发布第一个岗位</button><button class="bigbtn" style="width:100%;margin-top:10px;background:var(--card);color:#161616" onclick="closeSheet();tab('browse')">先看看人才库</button>`),300)}
function companyRow(){const c=S.company;return {type:c.type,name:c.name,en:c.en,license:c.license||'',contact:c.contact,phone:c.phone,city:c.city,
  industry:c.type==='personal'?'个人雇主':(IND.find(i=>i.id===c.ind)||{}).zh||'',loc:c.loc,needs:c.needs,start:c.start,note:c.note||''}}

const MSG={};
function msgCred(role){role=role||(S.mode==='wk'?'w':S.mode==='emp'?'e':null);
  if(role==='w'&&S.me&&S.me.dbid&&S.myToken)return {role,id:S.me.dbid,token:S.myToken};
  if(role==='e'&&S.company&&S.company.registered&&S.company.dbid&&S.company.token)return {role,id:S.company.dbid,token:S.company.token};
  return null}
function mstore(c){if(!c)return null;const key='msg_'+c.role+c.id;let m=MSG[c.role];
  if(!m||m.key!==key){m=MSG[c.role]={rows:[],peers:{},seen:{},last:0,...(LS.get(key,null)||{}),key}}return m}
function msave(m){m.rows=m.rows.filter(r=>!r.pending);if(m.rows.length>1500)m.rows=m.rows.slice(-1500);const {key,...d}=m;LS.set(key,d)}
const mrpc=(fn,b)=>DB.q('rpc/'+fn,{method:'POST',body:JSON.stringify(b)});
const peerOf=(c,r)=>c.role==='w'?r.employer_id:r.worker_id;
function mtime(r){const d=new Date(r.created_at||Date.now()),n=new Date();const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return d.toDateString()===n.toDateString()?hm:(d.getMonth()+1)+'/'+d.getDate()+' '+hm}
function threads(c){const m=mstore(c);if(!m)return [];const by={};
  m.rows.forEach(r=>{const p=peerOf(c,r);if(m.loaded&&!m.peers[p])return;const t=by[p]||(by[p]={peer:p,last:r,unread:0,inv:0});t.last=r;

  return Object.values(by).sort((a,b)=>(b.last.id>a.last.id?1:-1))}

function applyReplies(c,m){const byId={};m.rows.forEach(r=>byId[r.id]=r);
  m.rows.forEach(r=>{const mt=r.meta||{};if(!mt.iid||!byId[mt.iid])return;const iv=byId[mt.iid];iv.meta=iv.meta||{};
    if(r.kind==='invite_reply'){iv.meta.ans=mt.ans;if(mt.phone)iv.meta.wphone=mt.phone}if(r.kind==='cancel')iv.meta.cancel=true;
    if(c.role==='e'){const x=S.interviews.find(i=>i.mid===mt.iid);if(x){if(r.kind==='invite_reply'){x.ans=mt.ans;x.phone=mt.phone||x.phone}}}})}
/* 翻译：任意语言 → 中文 / 英文 → 当前语言 */
async function trTo(text,tl){text=(text||'').trim();if(!text)return '';
  try{const c=new AbortController();setTimeout(()=>c.abort(),6000);
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl='+tl+'&dt=t&q='+encodeURIComponent(text.slice(0,1500)),{signal:c.signal});
    const j=await r.json();if(j[2]&&String(j[2]).slice(0,2)===tl.slice(0,2))return '';return (j[0]||[]).map(x=>x[0]).join('')}catch(e){return ''}}
const MTR=LS.get('mtr',{});let _mtrQ={};

/* 轮询：聊天页 3 秒，其他页 10 秒；切回前台立即刷新 */
let _mpBusy=false,_mpT=null;
async function msgPoll(){const c=msgCred();if(!DB.on||!c||_mpBusy)return;_mpBusy=true;
  try{const m=mstore(c);const r=await mrpc('get_messages',{p_role:c.role,p_id:c.id,p_token:c.token,p_after:m.last||0});
    if(r&&r.msgs){const ids=new Set(m.rows.map(x=>x.id));const inc=[];
      r.msgs.forEach(x=>{if(ids.has(x.id))return;m.rows.push(x);if(x.id>(m.last||0))m.last=x.id;if(x.sender!==c.role&&!x.read_at)inc.push(x)});
      m.rows.sort((a,b)=>(typeof a.id==='number'?a.id:1e15)-(typeof b.id==='number'?b.id:1e15));
      const pc=JSON.stringify(r.peers||{})!==JSON.stringify(m.peers),sc=JSON.stringify(r.seen||{})!==JSON.stringify(m.seen);
      m.peers=r.peers||{};m.seen=r.seen||{};m.loaded=1;m.rows=m.rows.filter(x=>x.pending||m.peers[peerOf(c,x)]);applyReplies(c,m);
      const open=openPeer(c);if(open&&inc.some(x=>peerOf(c,x)===open))markRead(c,open,true);
      if(inc.length||pc||sc){msave(m);if(c.role==='e')persist();msgRender();inc.filter(x=>peerOf(c,x)!==open).slice(-1).forEach(x=>msgNotify(c,x))}}
  }catch(e){}finally{_mpBusy=false}}
function msgLoop(){clearTimeout(_mpT);const fast=['chat','w_chat','chats','w_msgs'].includes(S.view);
  _mpT=setTimeout(async()=>{if(!document.hidden)await msgPoll();msgLoop()},fast?3000:10000)}

let _pid=0;
async function msgSend(peer,kind,body,trans,meta){const c=msgCred();if(!c)return null;const m=mstore(c);
  const tmp={id:'p'+(++_pid),pending:true,sender:c.role,kind,body,trans,meta,created_at:new Date().toISOString(),worker_id:c.role==='w'?c.id:peer,employer_id:c.role==='e'?c.id:peer};
  m.rows.push(tmp);msgRender();
  try{const r=await mrpc('send_message',{p_role:c.role,p_id:c.id,p_token:c.token,p_peer:peer,p_kind:kind,p_body:body,p_trans:trans||null,p_meta:meta||null});
    const i=m.rows.indexOf(tmp);if(i>=0)m.rows.splice(i,1);if(!m.rows.some(x=>x.id===r.id))m.rows.push(r);
    m.peers[peer]=m.peers[peer]||{};msave(m);msgRender();return r}
  catch(e){tmp.pending=false;tmp.failed=true;tmp.id='f'+_pid;msgRender();toast(c.role==='w'?t('msg_fail'):'发送失败，请检查网络后重试');return null}}
function msgRetry(id){const c=msgCred();const m=mstore(c);const r=m.rows.find(x=>x.id===id);if(!r)return;m.rows.splice(m.rows.indexOf(r),1);msgSend(peerOf(c,r),r.kind,r.body,r.trans,r.meta)}

<script>
/* ================= v2.3 消息秒达：Realtime 推送提醒 + 先显示后发送 ================= */
/* 发消息后立刻通过 Supabase Realtime 广播一个“有新消息”的提醒（不含内容），对方收到后马上拉取；轮询只做兜底 */
const RTC={ws:null,topic:null,ok:false,ref:0,hb:null,retry:0,rt:null};
const rtBase=()=>CFG.supabaseUrl.replace(/\/$/,'');
function rtTopic(){const c=msgCred();return c?'hgm-'+c.role+'-'+c.id:null}
function rtConnect(){const tp=rtTopic();if(!DB.on||!tp||!window.WebSocket)return rtClose();
  if(RTC.ws&&RTC.topic===tp&&RTC.ws.readyState<=1)return;rtClose();RTC.topic=tp;
  let ws;try{ws=new WebSocket(rtBase().replace(/^http/,'ws')+'/realtime/v1/websocket?apikey='+CFG.supabaseAnonKey+'&vsn=1.0.0')}catch(e){return rtLater()}
  RTC.ws=ws;
  ws.onopen=()=>{RTC.retry=0;ws.send(JSON.stringify({topic:'realtime:'+tp,event:'phx_join',payload:{config:{broadcast:{self:false,ack:false},presence:{key:''},private:false},access_token:CFG.supabaseAnonKey},ref:String(++RTC.ref),join_ref:'1'}));
    clearInterval(RTC.hb);RTC.hb=setInterval(()=>{try{ws.readyState===1&&ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:String(++RTC.ref)}))}catch(e){}},25000)};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.event==='phx_reply'&&m.topic==='realtime:'+tp&&m.payload&&m.payload.status==='ok'){if(!RTC.ok){RTC.ok=true;msgPoll();msgLoop(true)}}
    else if(m.event==='broadcast'&&m.topic==='realtime:'+tp)msgPoll()};
  ws.onclose=()=>{if(RTC.ws!==ws)return;RTC.ok=false;clearInterval(RTC.hb);msgLoop(true);rtLater()};
  ws.onerror=()=>{try{ws.close()}catch(e){}}}
function rtLater(){clearTimeout(RTC.rt);RTC.rt=setTimeout(rtConnect,Math.min(30000,1500*Math.pow(2,RTC.retry++)))}
function rtClose(){clearTimeout(RTC.rt);clearInterval(RTC.hb);const w=RTC.ws;RTC.ws=null;RTC.ok=false;RTC.topic=null;if(w)try{w.close()}catch(e){}}
/* 通知对方：走 REST 广播，不依赖自己的 WebSocket */
function rtPing(role,id,ev){if(!DB.on||!id)return;fetch(rtBase()+'/realtime/v1/api/broadcast',{method:'POST',keepalive:true,
  headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+CFG.supabaseAnonKey,'Content-Type':'application/json'},
  body:JSON.stringify({messages:[{topic:'hgm-'+role+'-'+id,event:ev||'msg',payload:{}}]})}).catch(()=>{})}
const pingPeer=(c,peer,ev)=>rtPing(c.role==='w'?'e':'w',peer,ev);

/* 拉取：并发请求合并，进行中再来的提醒会在结束后补拉一次 */
let _mpAgain=false;
const _msgPoll14=msgPoll;
msgPoll=async function(){if(_mpBusy){_mpAgain=true;return}await _msgPoll14();if(_mpAgain){_mpAgain=false;await _msgPoll14()}};
/* 兜底轮询：已连上推送时聊天页 5 秒 / 其他 20 秒；没连上时 2.5 秒 / 6 秒。不会因为页面重绘被不断推迟 */
let _mpDue=0;
msgLoop=function(force){const chat=['chat','w_chat','chats','w_msgs'].includes(S.view);const d=RTC.ok?(chat?5000:20000):(chat?2500:6000);const due=Date.now()+d;
  if(!force&&_mpT&&_mpDue&&_mpDue<=due)return;clearTimeout(_mpT);_mpDue=due;
  _mpT=setTimeout(async()=>{_mpT=null;_mpDue=0;if(!document.hidden)await msgPoll();msgLoop()},d)};

/* 发送：气泡立刻出现，翻译和上传在后台进行，成功后通知对方 */
msgSend=async function(peer,kind,body,trans,meta){const c=msgCred();if(!c)return null;const m=mstore(c);
  const tmp={id:'p'+(++_pid),pending:true,sender:c.role,kind,body,trans:null,meta,created_at:new Date().toISOString(),worker_id:c.role==='w'?c.id:peer,employer_id:c.role==='e'?c.id:peer};
  m.rows.push(tmp);msgRender();const sc=$('#screen');if(sc&&['chat','w_chat'].includes(S.view))sc.scrollTop=sc.scrollHeight;
  let tr=trans;if(tr&&typeof tr.then==='function'){try{tr=await tr}catch(e){tr=null}}if(tr===body||tr==='')tr=null;tmp.trans=tr;
  try{const r=await mrpc('send_message',{p_role:c.role,p_id:c.id,p_token:c.token,p_peer:peer,p_kind:kind,p_body:body,p_trans:tr,p_meta:meta||null});
    pingPeer(c,peer);const i=m.rows.indexOf(tmp);if(i>=0)m.rows.splice(i,1);if(!m.rows.some(x=>x.id===r.id))m.rows.push(r);
    m.peers[peer]=m.peers[peer]||{};msave(m);msgRender();return r}
  catch(e){tmp.pending=false;tmp.failed=true;tmp.id='f'+_pid;msgRender();toast(c.role==='w'?t('msg_fail'):'发送失败，请检查网络后重试');return null}};
/* 招聘方发消息：不再等翻译 */
sendMsg=async function(k){const id=S.params.id;if(!realW(id))return _sendMsg13(k);let o,tr;
  if(k!==undefined){[o,tr]=QUICK[k]}else{const i=$('#mi');o=i.value.trim();if(!o)return;i.value='';tr=zh2en(o)}
  msgSend(id-100000,'text',o,tr,null)};
/* 工人发消息：不再等翻译 */
wSend=function(){const i=$('#mi');const o=(i&&i.value||'').trim();if(!o)return;i.value='';i.focus();msgSend(S.params.eid,'text',o,trTo(o,'zh-CN'),null)};
/* 已读回执也即时通知对方 */
const _markRead14=markRead;
markRead=async function(c,peer,silent){const m=mstore(c);const had=m.rows.some(r=>peerOf(c,r)===peer&&r.sender!==c.role&&!r.read_at);await _markRead14(c,peer,silent);if(had)pingPeer(c,peer,'read')};
/* 接受 / 拒绝面试：立即显示，后台提交，成功后通知招聘方 */
const _wAnswer14=wAnswer;
wAnswer=async function(mid,ans){const c=msgCred('w');const m=c&&mstore(c);const iv=m&&m.rows.find(r=>r.id===mid);await _wAnswer14(mid,ans);
  if(iv&&iv.meta&&iv.meta.ans===ans)pingPeer(c,iv.employer_id)};
/* 回到前台 / 网络恢复：立即重连并拉取 */
document.addEventListener('visibilitychange',()=>{if(!document.hidden)rtConnect()});
window.addEventListener('online',()=>{rtConnect();msgPoll()});
/* 身份变化（注册、切换工人/招聘方）时切换推送频道 */
const _render14b=render;render=function(top){_render14b(top);if(rtTopic()!==RTC.topic)rtConnect()};
/* 打开对话时先显示本地记录，再静默刷新（不阻塞页面切换） */
const _openChat14=openChat;openChat=function(id){_openChat14(id)};
if(DB.on){rtConnect();msgLoop(true)}

</script>
<script>
/* ================= v2.4 锁屏推送（Firebase Cloud Messaging） ================= */
/* 安装包里带有推送插件时才启用；网页版和旧安装包不受影响 */
const PUSH={tok:LS.get('fcm',null),inited:false,synced:LS.get('fcm_sync',''),perm:null};
function pushAvail(){const C=window.Capacitor;return !!(C&&C.isNativePlatform&&C.isNativePlatform()&&C.isPluginAvailable&&C.isPluginAvailable('PushNotifications'))}
async function pushInit(){if(PUSH.inited||!pushAvail()||!msgCred())return;PUSH.inited=true;const P=Capacitor.Plugins.PushNotifications;
  try{await P.createChannel({id:'messages',name:'消息与面试邀请 Messages',description:'New messages and interview invitations',importance:5,visibility:1,vibration:true,lights:true,lightColor:'#CFE36B'})}catch(e){}
  P.addListener('registration',t=>{PUSH.tok=t.value;LS.set('fcm',t.value);pushSync()});
  P.addListener('registrationError',e=>console.warn('push',e));
  P.addListener('pushNotificationReceived',()=>msgPoll());
  P.addListener('pushNotificationActionPerformed',a=>{const d=(a&&a.notification&&a.notification.data)||{};msgPoll();const peer=+d.peer;if(!peer)return;
    setTimeout(()=>{if(d.role==='w'&&S.mode==='wk'&&msgCred('w'))wOpenChat(peer);else if(d.role==='e'&&S.mode==='emp'&&msgCred('e'))openChat(100000+peer)},400)});
  try{let st=await P.checkPermissions();if(st.receive!=='granted'&&st.receive!=='denied')st=await P.requestPermissions();PUSH.perm=st.receive;
    if(st.receive==='granted')await P.register();else if(S.view)render(false)}catch(e){console.warn(e)}}
async function pushSync(){const c=msgCred();if(!c||!PUSH.tok||!DB.on)return;const k=c.role+c.id+':'+PUSH.tok.slice(-24)+':'+S.lang;if(k===PUSH.synced)return;
  try{const ok=await mrpc('register_push',{p_role:c.role,p_id:c.id,p_token:c.token,p_fcm:PUSH.tok,p_lang:S.lang});if(ok){PUSH.synced=k;LS.set('fcm_sync',k)}}catch(e){}}
/* 通知被关闭时，在“我的”里提示去开启 */
function pushRow(zh){if(!pushAvail())return '';const on=PUSH.perm==='granted';
  return `<div class="li" style="cursor:pointer" onclick="pushFix()">${ic('bell')}<span>${zh?'锁屏消息通知':t('push_title')}</span><span class="xs" style="margin-left:auto;color:${on?'#2e7d32':'#c0392b'};font-weight:700">${on?(zh?'已开启':t('push_on')):(zh?'未开启 · 去开启':t('push_off'))}</span></div>`}
async function pushFix(){if(!pushAvail())return;const P=Capacitor.Plugins.PushNotifications;let st=await P.checkPermissions();
  if(st.receive!=='granted')st=await P.requestPermissions();PUSH.perm=st.receive;
  if(st.receive==='granted'){await P.register();toast(S.mode==='wk'?t('push_on'):'锁屏通知已开启')}
  else toast(S.mode==='wk'?t('push_hint'):'请到手机 设置 → 应用 → JobPaw → 通知 中允许通知');render(false)}
const _vme15=V.me;V.me=()=>{const h=_vme15();const r=pushRow(true);if(!r)return h;const i=h.lastIndexOf('<div class="box"');return i<0?h:h.slice(0,i)+`<div class="box">${r}</div>`+h.slice(i)};
const _vwme15=V.w_me;V.w_me=()=>{const h=_vwme15();const r=pushRow(false);if(!r)return h;const i=h.lastIndexOf('<div class="box"');return i<0?h:h.slice(0,i)+`<div class="box">${r}</div>`+h.slice(i)};
Object.assign(T,{push_title:['Lock-screen notifications','Lock-screen notifications','锁屏消息通知'],push_on:['On','On','已开启'],push_off:['Off · Turn on','Off · Turn on','未开启 · 去开启'],
  push_hint:['Please allow notifications in Settings → Apps → JobPaw → Notifications','Please allow notifications in Settings → Apps → JobPaw → Notifications','请到手机 设置 → 应用 → JobPaw → 通知 中允许通知']});
const _render15=render;render=function(top){_render15(top);if(msgCred()){if(!PUSH.inited)pushInit();else pushSync()}};
document.addEventListener('visibilitychange',async()=>{if(document.hidden||!pushAvail()||!PUSH.inited)return;
  try{const st=await Capacitor.Plugins.PushNotifications.checkPermissions();if(st.receive!==PUSH.perm){PUSH.perm=st.receive;if(st.receive==='granted')Capacitor.Plugins.PushNotifications.register();render(false)}
    Capacitor.Plugins.PushNotifications.removeAllDeliveredNotifications&&Capacitor.Plugins.PushNotifications.removeAllDeliveredNotifications()}catch(e){}});

<script>
/* ================= v2.5 防闪烁：同一页面刷新时只更新变化的部分 ================= */
/* 原因：每次收到消息/同步数据都会整页重画，并重新播放 0.28 秒的淡入动画，看起来就是“闪一下”；
   输入框也会被重建，键盘会跳。现在同一页面内的刷新改为“差量更新”：没变的元素原封不动。 */
function morphNode(a,b){
  if(a.nodeType===3||a.nodeType===8){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  const ba=b.attributes,aa=a.attributes;
  for(let i=aa.length-1;i>=0;i--){const n=aa[i].name;if(!b.hasAttribute(n))a.removeAttribute(n)}
  for(let i=0;i<ba.length;i++){const n=ba[i].name,v=ba[i].value;if(a.getAttribute(n)!==v)a.setAttribute(n,v)}
  morphKids(a,b);
  const tg=a.tagName;if((tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')&&document.activeElement!==a){
    if(tg==='INPUT'&&(a.type==='checkbox'||a.type==='radio'))a.checked=b.checked;else if(a.value!==b.value)a.value=b.value}}
function morphKids(a,b){const ac=[...a.childNodes],bc=[...b.childNodes];
  for(let i=0;i<bc.length;i++){const x=ac[i],y=bc[i];
    if(!x){a.appendChild(y);continue}
    if(x.nodeType===y.nodeType&&(x.nodeType!==1||(x.tagName===y.tagName&&(x.tagName!=='INPUT'||x.type===y.type))))morphNode(x,y);
    else a.replaceChild(y,x)}
  for(let i=bc.length;i<ac.length;i++)ac[i].remove()}
const LIVE_EL={sc:$('#screen'),fx:$('#fixed'),nv:$('#navwrap')};
let _lastV16=null;
const _render16=render;
render=function(top){
  const v0=S.view;
  if(top||v0!==_lastV16||v0==='welcome'){const r=_render16(top);_lastV16=S.view;return r}
  const sc=LIVE_EL.sc,st=sc.scrollTop,wasBottom=sc.scrollHeight-st-sc.clientHeight<80;
  const sh=document.createElement('div');sh.style.cssText=`position:fixed;left:-30000px;top:0;width:${sc.clientWidth||400}px;height:${sc.clientHeight||700}px;visibility:hidden;pointer-events:none`;
  const TT={sc:document.createElement('div'),fx:document.createElement('div'),nv:document.createElement('div')};
  TT.sc.className=sc.className;TT.sc.style.cssText='position:absolute;inset:0;overflow:auto';
  const ids={sc:'screen',fx:'fixed',nv:'navwrap'};
  for(const k in ids){LIVE_EL[k].id=ids[k]+'__live';TT[k].id=ids[k];sh.appendChild(TT[k])}
  document.body.appendChild(sh);
  try{_render16(top)}finally{for(const k in ids){TT[k].removeAttribute('id');LIVE_EL[k].id=ids[k]}sh.remove()}
  if(S.view!==v0){ /* 渲染过程中跳到了别的页面：整页替换并播放动画 */
    for(const k in ids){LIVE_EL[k].replaceChildren(...TT[k].childNodes)}sc.className=TT.sc.className;sc.scrollTop=0;_lastV16=S.view;return}
  sc.className=TT.sc.className;
  morphKids(sc,TT.sc);morphKids(LIVE_EL.fx,TT.fx);morphKids(LIVE_EL.nv,TT.nv);
  if(['chat','w_chat'].includes(S.view)&&wasBottom)sc.scrollTop=sc.scrollHeight;else sc.scrollTop=st;
  _lastV16=S.view};

document.head.insertAdjacentHTML('beforeend','<style>#screen{overscroll-behavior:contain}.fade{will-change:auto}</style>');

/* ================= v2.5 应用内更新：App 自己下载并安装，不再跳到 GitHub ================= */
Object.assign(T,{
  upd_dl:['Downloading update…','Downloading update…','正在下载新版…'],
  upd_dl_fail:['Download failed. Check your network and try again.','Download failed. Check your network and try again.','下载失败，请检查网络后重试'],
  upd_retry:['Retry','Retry','重试'],
  upd_browser:['Download in browser','Download in browser','用浏览器下载'],
  upd_install:['Install now','Install now','立即安装'],
  upd_perm:['Allow JobPaw to install updates: tap the button, turn on “Allow from this source”, then come back.','Allow JobPaw to install updates: tap the button, turn on “Allow from this source”, then come back.','需要允许 JobPaw 安装更新：点下方按钮，打开“允许来自此来源的应用”，然后返回 App 即可继续安装。'],
  upd_perm_btn:['Open settings','Open settings','去允许'],
  upd_ready:['Download complete','Download complete','下载完成'],
  upd_cancel:['Cancel','Cancel','取消'],
});
const APK_URLS=()=>{const v=UPD.remote||{};return [...new Set([v.apkMirror||'https://hiregh.pages.dev/app/JobPaw.apk',v.apk||'https://github.com/debaoqi/hiregh/releases/latest/download/JobPaw.apk'])]};
const hasUpdater=()=>isNative()&&window.Capacitor.isPluginAvailable&&window.Capacitor.isPluginAvailable('AppUpdater');
const UPX={st:'idle',pct:0,done:0,total:0,err:'',wait:false};
const mb=n=>(n/1048576).toFixed(1)+' MB';
function updSheet(){const s=UPX.st;const bar=`<div style="height:12px;border-radius:8px;background:#E7E1D4;overflow:hidden;margin-top:16px"><div id="updBar" style="height:100%;width:${Math.max(3,UPX.pct)}%;background:var(--lime);transition:width .25s"></div></div>
   <div class="row between sm" style="margin-top:8px"><span id="updPct" class="b">${UPX.pct>=0?UPX.pct+'%':''}</span><span id="updSz" class="muted">${UPX.total?mb(UPX.done)+' / '+mb(UPX.total):UPX.done?mb(UPX.done):''}</span></div>`;
  const head=`<div class="row gap" style="align-items:center"><img src="logo.svg" style="width:52px;height:52px;border-radius:16px"><div><div class="b" style="font-size:20px">JobPaw v${esc((UPD.remote||{}).version||'')}</div><div class="sm muted">${s==='dl'?t('upd_dl'):s==='ready'?t('upd_ready'):s==='perm'?t('upd_install'):t('upd_dl_fail')}</div></div></div>`;
  let body='';
  if(s==='dl')body=bar+`<button class="bigbtn" style="width:100%;margin-top:16px;background:var(--card);color:#161616" onclick="updCancel()">${t('upd_cancel')}</button>`;
  else if(s==='ready')body=bar+`<button class="bigbtn" style="width:100%;margin-top:16px" onclick="updInstall()">${t('upd_install')}</button>`;
  else if(s==='perm')body=`<div class="note-y" style="margin-top:14px;line-height:1.6">${t('upd_perm')}</div><button class="bigbtn" style="width:100%;margin-top:16px" onclick="updPermit()">${t('upd_perm_btn')}</button>`;
  else body=`<div class="sm" style="margin-top:12px;color:var(--red)">${esc(UPX.err||'')}</div><div class="row gap" style="margin-top:16px"><button class="bigbtn" style="background:var(--card);color:#161616;flex:1" onclick="updBrowser()">${t('upd_browser')}</button><button class="bigbtn" style="flex:1" onclick="doApk()">${t('upd_retry')}</button></div>`;
  openSheet(head+body)}
function updProg(){const b=$('#updBar');if(!b)return;b.style.width=Math.max(3,UPX.pct)+'%';$('#updPct').textContent=UPX.pct>=0?UPX.pct+'%':'';$('#updSz').textContent=UPX.total?mb(UPX.done)+' / '+mb(UPX.total):mb(UPX.done)}
let _updL=null;
async function updDownload(url){const P=window.Capacitor.Plugins.AppUpdater;let last=Date.now(),lastDone=0;
  return new Promise(async(res,rej)=>{let fin=false;
    const dog=setInterval(()=>{if(fin)return;if(UPX.done>lastDone){lastDone=UPX.done;last=Date.now()}else if(Date.now()-last>20000){clearInterval(dog);P.cancel();rej(new Error('stalled'))}},2000);
    try{let r;for(let k=0;;k++){try{r=await P.download({url});break}catch(e){if(/busy/.test(e.message||e)&&k<8){await new Promise(z=>setTimeout(z,1000));continue}throw e}}fin=true;clearInterval(dog);res(r)}catch(e){fin=true;clearInterval(dog);rej(e)}})}
doApk=async function(){
  if(!isNative())return window.open(APK_URLS()[0],'_blank');
  if(!hasUpdater())return updBrowser();
  if(UPX.st==='dl'){updSheet();return}
  const P=window.Capacitor.Plugins.AppUpdater;if(!_updL)_updL=await P.addListener('progress',p=>{UPX.pct=p.pct;UPX.done=p.done;UPX.total=p.total;updProg()});
  UPX.st='dl';UPX.pct=0;UPX.done=0;UPX.total=0;UPX.err='';updSheet();$('#sheet').dataset.force='1';
  let ok=false;for(const u of APK_URLS()){try{UPX.pct=0;UPX.done=0;updProg();await updDownload(u);ok=true;break}catch(e){UPX.err=String(e&&e.message||e);if(/cancelled/.test(UPX.err)&&UPX.st!=='dl')return}}
  $('#sheet').dataset.force='0';
  if(!ok){UPX.st='fail';UPX.err=t('upd_dl_fail');updSheet();return}
  UPX.st='ready';UPX.pct=100;updSheet();updInstall()};
async function updInstall(){const P=window.Capacitor.Plugins.AppUpdater;try{const r=await P.install();if(r&&r.needPermission){UPX.st='perm';UPX.wait=true;updSheet()}}catch(e){UPX.st='fail';UPX.err=String(e.message||e);updSheet()}}
function updPermit(){UPX.wait=true;window.Capacitor.Plugins.AppUpdater.openInstallSettings()}
function updCancel(){UPX.st='idle';$('#sheet').dataset.force='0';try{window.Capacitor.Plugins.AppUpdater.cancel()}catch(e){}closeSheet()}
/* 旧版安装包没有内置下载器：交给系统浏览器从 Cloudflare 镜像下载（不走 GitHub） */
function updBrowser(){const v=UPD.remote||{};location.href=v.apkExt||v.apk||APK_URLS()[APK_URLS().length-1]}
/* 从“允许安装”设置页返回后，自动继续安装 */
try{window.Capacitor&&window.Capacitor.Plugins.App&&window.Capacitor.Plugins.App.addListener('resume',async()=>{if(!UPX.wait||!hasUpdater())return;
  const r=await window.Capacitor.Plugins.AppUpdater.canInstall();if(r.allowed){UPX.wait=false;UPX.st='ready';updSheet();updInstall()}})}catch(e){}
/* 更新提示框：用新 Logo 替换旧的 “H” */
const _showUpd16=showUpd;showUpd=function(v,k){_showUpd16(v,k);const h=$('#sheet span[style*="font-weight:900"]');if(h&&h.textContent==='H')h.outerHTML='<img src="logo.svg" style="width:52px;height:52px;border-radius:16px">'};

</script>
<script>
/* ================= v2.5.1 更新提示更可靠 ================= */
/* 问题：点过一次“稍后”后，安装包提示会被静默 24 小时；新版本出来也不提示，看起来就是“没反应”。
   现在：①“稍后”只对当前这个版本有效，出新版本立刻再提示，最多静默 2 小时；
        ② 页面顶部常驻一条“有新版本”提示条，随时点开更新；
        ③ 旧安装包（没有内置下载器）改用国内也能快速访问的 CDN 下载，并提供“复制链接”备用。 */
const UPD_PENDING={kind:null,v:null};
const apkKey=v=>'n'+(v.minNative||0);
updLater=function(b){const v=UPD.remote||{};LS.set('updLater',{b,t:Date.now()});LS.set('apkLater2',{k:apkKey(v),t:Date.now()});closeSheet()};
checkUpdate=async function(manual){
  if(UPD.busy)return;UPD.busy=true;
  try{const r=await fetch('/version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const v=await r.json();UPD.remote=v;
    let kind=null;
    if((+v.build||0)>APP_BUILD)kind='web';
    else if(isNative()&&v.minNative){const nb=await nativeBuild();if(nb&&nb<v.minNative)kind='apk'}
    UPD_PENDING.kind=kind;UPD_PENDING.v=v;updBarSync();
    if(!kind){if(manual)toast(t('upd_latest')+' · v'+APP_VER);return}
    if(!manual&&!v.force){
      if(kind==='web'){const d=LS.get('updLater',null);if(d&&d.b===v.build&&Date.now()-d.t<2*3600e3)return}
      else{const d=LS.get('apkLater2',null);if(d&&d.k===apkKey(v)&&Date.now()-d.t<2*3600e3)return}}
    if($('#sheet').classList.contains('on')&&!manual)return;
    showUpd(v,kind)}
  catch(e){if(manual)toast(t('upd_fail'))}
  finally{UPD.busy=false}};
Object.assign(T,{upd_bar:['New version available — tap to update','New version available — tap to update','有新版本，点此更新'],
  upd_copy:['Copy download link','Copy download link','复制下载链接'],
  upd_ext_tip:['If the download does not start, copy the link and open it in your phone browser.','If the download does not start, copy the link and open it in your phone browser.','如果没有开始下载，请复制链接，用手机浏览器打开即可下载安装。']});
function updBarSync(){let el=document.getElementById('updBarTop');const sc=$('#screen');if(!sc)return;
  const fx=$('#fixed');const hide=!UPD_PENDING.kind||['chat','w_chat','e_reg','w_reg','post','welcome'].includes(S.view)||(fx&&fx.children.length)||$('#sheet').classList.contains('on');
  if(!el){el=document.createElement('div');el.id='updBarTop';el.onclick=()=>checkUpdate(true);
    el.style.cssText='position:absolute;left:16px;right:16px;bottom:calc(98px + env(safe-area-inset-bottom));z-index:40;padding:11px 14px;border-radius:16px;background:#161616;color:var(--lime);display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)';
    sc.parentNode.appendChild(el)}
  el.style.display=hide?'none':'flex';if(hide)return;
  const zh=S.mode==='emp'||S.lang==='zh';const txt=zh?'有新版本 v'+(UPD_PENDING.v.version||'')+'，点此更新':t('upd_bar');
  if(el.dataset.t!==txt){el.dataset.t=txt;el.innerHTML=ic('arrow',16)+'<span style="flex:1">'+esc(txt)+'</span><span>›</span>'}}
const _render17=render;render=function(top){_render17(top);updBarSync()};
const _close17=closeSheet;closeSheet=function(){const r=_close17();setTimeout(updBarSync,50);return r};
/* 旧安装包：从 CDN 下载（不走 GitHub），并给出复制链接的备用方式 */
const EXT_APK=()=>{const v=UPD.remote||{};return v.apkExt||'https://cdn.jsdelivr.net/gh/debaoqi/hiregh@main/www/app/JobPaw.apk'};
updBrowser=function(){const u=EXT_APK();

   <div class="note-y" style="margin-top:14px;line-height:1.6">${t('upd_ext_tip')}</div>
   <div class="xs" style="margin-top:10px;word-break:break-all;background:var(--card);padding:10px;border-radius:12px">${esc(u)}</div>
   <div class="row gap" style="margin-top:14px"><button class="bigbtn" style="flex:1;background:var(--card);color:#161616" onclick="copyText('${esc(u)}')">${t('upd_copy')}</button><button class="bigbtn" style="flex:1" onclick="location.href='${esc(u)}'">${t('upd_apk')}</button></div>`);
  setTimeout(()=>{location.href=u},300)};
setTimeout(()=>checkUpdate(false),1200);

</script>
