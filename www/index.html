<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>加纳用工 HireGH</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#EDE8DC;--card:#FBF9F4;--ink:#161616;--muted:#9C978B;--line:#ECE6DA;--soft:#F1EDE3;
  --purple:#9D7DFF;--lilac:#E2B2FA;--gold:#F8C94A;--red:#EE5A47;--lime:#CFE36B;--orange:#FF9F43;--blue:#5B8CFF;--green:#1E7A4C;
  --r:28px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:#D9D2C1;background-image:linear-gradient(#cfc7b5 1px,transparent 1px),linear-gradient(90deg,#cfc7b5 1px,transparent 1px);background-size:32px 32px;
  display:flex;align-items:center;justify-content:center;min-height:100vh}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.phone{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);overflow:hidden}
.sbar{display:none}
@media (min-width:520px){
  .phone{width:390px;height:min(844px,calc(100vh - 32px));min-height:600px;border-radius:54px;border:11px solid #111;box-shadow:0 40px 80px rgba(0,0,0,.25)}
  .sbar{display:flex;position:absolute;top:0;left:0;right:0;height:46px;z-index:30;justify-content:space-between;align-items:center;padding:6px 30px 0;font-weight:600;font-size:15px;pointer-events:none}
  .sbar .island{width:110px;height:30px;background:#111;border-radius:20px}
  .phone .screen{top:46px}
  .sbar{background:var(--bg)}
}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:120px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.nonav{padding-bottom:120px}
.screen.chatpad{padding-bottom:150px}
.pad{padding:12px 20px}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:10px}.gap6{gap:6px}.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:700}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#111;flex:none;font-size:15px;position:relative}
.av.lg{width:92px;height:92px;font-size:30px;border:4px solid #fff}
.av.sm{width:36px;height:36px;font-size:13px}
.icbtn{width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;position:relative;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.icbtn.dark{background:#161616;color:#fff}
.dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
.hero{font-size:36px;line-height:1.18;font-weight:800;letter-spacing:-1px;margin:26px 0 20px}
.hero .hl{background:var(--gold);padding:0 8px;border-radius:14px;display:inline-block;transform:rotate(-2deg)}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:30px;padding:8px 8px 8px 18px;color:var(--muted)}
.searchbar input{flex:1;border:0;background:none;outline:none;font-size:15px;color:var(--ink);min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.dark{background:#161616;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--card);border-radius:20px;padding:12px}
.stat .n{font-size:22px;font-weight:800;letter-spacing:-.5px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px;font-size:19px;font-weight:800}
.sec-h a{font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
/* stacked industry cards */
.stack .sc{border-radius:30px;padding:18px 18px 40px;margin-top:-26px;position:relative;cursor:pointer;transition:transform .15s}
.stack .sc:first-child{margin-top:0}
.stack .sc:active{transform:scale(.98)}
.sc .ic{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#111}
.sc .go{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#111}
.sc .t{font-size:19px;font-weight:800}
.sc .roles{font-size:12px;opacity:.75;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .row.gap:first-child{min-width:0;flex:1}.sc .row.gap>div:last-child{min-width:0}
.sc span.sm{white-space:nowrap}
.sc.last{padding-bottom:22px}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.natc{background:var(--card);border-radius:22px;padding:12px 14px;min-width:112px;cursor:pointer;flex:none}
.natc .n{font-weight:800;font-size:20px;margin-top:8px}
.flag{width:22px;height:15px;border-radius:3px;display:inline-block;position:relative;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.flag i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:9px;line-height:1}
.mc{background:var(--card);border-radius:26px;padding:14px;width:168px;flex:none;cursor:pointer}
.mc .tag{font-size:11px;padding:4px 9px;border-radius:20px;display:inline-block;font-weight:600}
/* worker list cards (ref 1) */
.wc{background:var(--card);border-radius:var(--r);margin-bottom:12px;overflow:hidden;cursor:pointer}
.wc .top{padding:18px 18px 14px}
.wc h3{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.wc h3 small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}
.badge{border-radius:30px;padding:7px 12px;font-size:12.5px;white-space:nowrap;font-weight:500}
.badge.cream{background:#F1ECDF}.badge.lilac{background:var(--lilac)}.badge.grey{background:#D6D3CC}.badge.lime{background:var(--lime)}.badge.gold{background:var(--gold)}
.cols{display:flex;margin-top:14px}
.cols>div{flex:1;padding-right:10px;border-right:1px solid var(--line);margin-right:12px;min-width:0}
.cols>div:nth-child(2){flex:1.5}.cols>div:last-child{border:0;margin:0;flex:1.2}
.cols .l{font-size:12px;color:#B9B4A8}
.cols .v{font-size:17px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc .bot{border-top:1px solid var(--line);padding:12px 18px 14px;display:flex;align-items:center;gap:10px}
.wc .bot .nm{font-size:14px;font-weight:600}
.wc .bot .em{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.act{width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.act.on{color:var(--red)}
.act.on svg{fill:var(--red)}
.act.del{color:var(--red)}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{border-radius:30px;padding:9px 15px;font-size:13px;background:var(--card);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1.5px solid transparent;font-weight:500}
.chip.on{background:#161616;color:#fff}
.chip.sm{padding:6px 11px;font-size:12px}
.tabsx{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px;scrollbar-width:none}
.tabsx::-webkit-scrollbar{display:none}
.tabx{padding:10px 16px;border-radius:30px;font-weight:700;font-size:14px;background:var(--card);white-space:nowrap;cursor:pointer}
.toggles{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tg{font-size:12px;padding:7px 12px;border-radius:30px;border:1.5px dashed #C9C3B6;cursor:pointer}
.tg.on{border-style:solid;border-color:#161616;background:#161616;color:#fff}
.title{font-size:32px;font-weight:800;letter-spacing:-.8px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 20px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
/* detail */
.dhead{border-radius:0 0 40px 40px;padding:10px 20px 26px;text-align:center}
.dhead .name{font-size:28px;font-weight:800;margin-top:10px;letter-spacing:-.5px}
.rpill{display:inline-block;background:rgba(255,255,255,.75);border-radius:30px;padding:7px 16px;font-weight:600;margin-top:8px;font-size:14px}
.kv{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.kv span{background:#fff;border-radius:30px;padding:8px 13px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.box{background:var(--card);border-radius:26px;padding:18px;margin-top:14px}
.box h4{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.box ul{padding-left:18px;font-size:14px;line-height:1.75}
.inf{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.inf .l{font-size:12px;color:var(--muted)}.inf .v{font-size:14px;font-weight:600;margin-top:2px}
.vf{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.vf:last-child{border:0}
.vf .ok{width:24px;height:24px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
.vf .no{background:#EEE9DE;color:var(--muted)}
.vf svg{width:14px;height:14px}
.stage{border-radius:26px;padding:16px 18px;margin-top:-18px;position:relative}
.stage:first-child{margin-top:0}
.stage .s{font-size:11px;background:#161616;color:#fff;border-radius:20px;padding:4px 10px;display:inline-block}
.stage .t{font-size:22px;font-weight:800;margin-top:8px;letter-spacing:-.4px}
.stage p{font-size:12px;opacity:.85;margin:4px 0 14px;line-height:1.5}
.stage .st{position:absolute;right:16px;top:16px;width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center}
.review{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.55}
.review:last-child{border:0}
.bbar{position:absolute;left:0;right:0;bottom:0;padding:14px 20px 26px;background:var(--bg);box-shadow:0 -10px 20px -12px rgba(0,0,0,.18);display:flex;gap:10px;z-index:20}
.bigbtn{flex:1;background:#161616;color:#fff;border-radius:40px;height:58px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.bigbtn.lime{background:var(--lime);color:#161616}
.sqbtn{width:58px;height:58px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
/* nav */
.nav{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#161616;border-radius:46px;padding:7px;display:flex;gap:6px;z-index:25;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.nav button{width:52px;height:52px;border-radius:50%;background:#2A2A2A;color:#bbb;display:grid;place-items:center;position:relative}
.nav button.on{background:var(--gold);color:#161616}
.nav button.add{background:var(--lime);color:#161616}
.nav .cnt{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:10px;display:grid;place-items:center;padding:0 4px;font-weight:700}
/* post form (ref 2) */
.formwrap{background:var(--red);border-radius:36px 36px 0 0;padding:24px 20px 140px;min-height:100%;color:#161616;margin-top:8px}
.formwrap h2{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.fl{font-weight:700;font-size:15px;margin:18px 0 8px}
.fi{width:100%;border:1.5px solid rgba(0,0,0,.18);background:rgba(255,255,255,.12);border-radius:40px;padding:15px 20px;outline:none;font-size:15px}
.fi::placeholder{color:rgba(0,0,0,.45)}
textarea.fi{border-radius:24px;min-height:90px;resize:none}
.fi:focus{border-color:#161616;background:rgba(255,255,255,.25)}
.formwrap .chip{background:#161616;color:#ddd}
.formwrap .chip.on{background:#fff;color:#161616}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1.5px solid rgba(0,0,0,.18);border-radius:40px;padding:6px}
.stepper button{width:40px;height:40px;border-radius:50%;background:#161616;color:#fff;font-size:20px}
.stepper b{font-size:18px}
/* chats (ref 4) */
.cb{border-radius:34px;padding:14px 16px;display:flex;gap:12px;margin-top:-6px;position:relative;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.06)}
.cb:first-child{margin-top:0}
.cb .msg{font-size:12.5px;line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cb .un{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:#161616;color:#fff;font-size:11px;display:grid;place-items:center}
.cb .tail{position:absolute;bottom:-9px;width:18px;height:18px;transform:rotate(45deg);border-radius:3px}
/* conversation */
.chead{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);position:sticky;top:0;z-index:5}
.msgs{padding:10px 16px}
.m{max-width:78%;padding:12px 15px;border-radius:22px;font-size:14px;line-height:1.45;margin:8px 0}
.m.them{background:var(--card);border-bottom-left-radius:6px}
.m.me{background:#161616;color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.m .tr{font-size:12px;opacity:.6;border-top:1px dashed currentColor;margin-top:8px;padding-top:6px}
.m .tm{font-size:10px;opacity:.5;margin-top:4px;text-align:right}
.inputbar{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 24px;background:var(--bg);display:flex;gap:8px;align-items:center;z-index:20}
.inputbar input{flex:1;background:var(--card);border:0;border-radius:30px;padding:15px 18px;outline:none;font-size:15px}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:var(--bg);position:absolute;left:0;right:0;bottom:86px;z-index:20;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
/* jobs (ref 1) */
.seg{display:flex;background:var(--card);border-radius:30px;padding:4px;margin:6px 0 14px}
.seg button{flex:1;padding:10px;border-radius:26px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:#161616;color:#fff}
/* me (ref 6) */
.ccard{border-radius:30px;padding:20px;background:linear-gradient(135deg,#D9EE7A,#9CC437);position:relative;overflow:hidden}
.ccard:after{content:"HireGH";position:absolute;right:-6px;bottom:-14px;font-size:64px;font-weight:900;opacity:.08;letter-spacing:-2px}
.ccard .cn{font-size:22px;font-weight:800;line-height:1.2;margin-top:10px}
.ccard .row3{display:flex;margin-top:18px;gap:8px}
.ccard .row3 div{flex:1;background:rgba(255,255,255,.4);border-radius:18px;padding:10px}
.ccard .row3 b{font-size:20px;display:block}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{background:var(--card);border-radius:20px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;font-weight:500}
.qa .qi{width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
/* sheet/toast */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:.25s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:34px 34px 0 0;padding:10px 20px 30px;z-index:41;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:85%;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:#CFC8BA;margin:0 auto 14px}
.toast{position:absolute;left:50%;bottom:112px;transform:translate(-50%,20px);max-width:88%;white-space:normal!important;text-align:center;background:#161616;color:#fff;padding:12px 18px;border-radius:30px;font-size:13px;z-index:60;opacity:0;transition:.3s;pointer-events:none;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fade{animation:fd .28s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ivc{background:var(--card);border-radius:22px;padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.datebox{width:54px;height:58px;border-radius:16px;background:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.datebox b{font-size:20px;line-height:1}
.logo{width:36px;height:36px;border-radius:12px;background:var(--lime);display:grid;place-items:center;font-weight:900;font-size:18px}
.up{height:150px;border-radius:24px;border:2px dashed #C9C3B6;background:var(--card) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.up.round{width:84px;height:84px;border-radius:50%;flex:none}
.steps{display:flex;gap:6px;flex:1;margin:0 14px}.steps i{flex:1;height:6px;border-radius:6px;background:rgba(0,0,0,.15)}.steps i.on{background:#161616}
.regwrap{background:var(--bg);padding:16px 20px 130px}
.regwrap .fi{background:var(--card);border-color:transparent}.regwrap .fi:focus{border-color:#161616;background:#fff}
.regwrap .stepper{background:var(--card);border-color:transparent}
.consent{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:20px;padding:14px;margin-top:18px;font-size:12.5px;line-height:1.5}
.consent input{width:20px;height:20px;flex:none;accent-color:#161616;margin-top:2px}
@media (max-width:519px){.screen{padding-top:env(safe-area-inset-top)}.nav{bottom:calc(14px + env(safe-area-inset-bottom))}.bbar,.inputbar{padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
.select{appearance:none;background:var(--card);border:0;border-radius:30px;padding:9px 14px;font-size:13px;font-weight:600;outline:none}
.note-y{background:var(--gold);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:6px}details>summary::-webkit-details-marker{display:none}
</style>
</head>

const rolesChips=(ind,cur)=>ind.roles.map((r,k)=>`<span class="chip sm ${(cur?cur===r[0]:k===0)?'on':''}" data-v="${r[0]}" data-en="${r[1]}" onclick="pickOne(this);$('#pTitle').value=this.dataset.v">${r[0]}</span>`).join('');
function fillRoles(id){$('#pRole').innerHTML=rolesChips(IND.find(i=>i.id===id));$('#pTitle').value=''}
function stp(d){const b=$('#pN');b.textContent=Math.max(1,+b.textContent+d)}
function savePost(id){
  const role=$('#pRole .chip.on');const title=$('#pTitle').value.trim()||role?.dataset.v;
  const lo=$('#pLo').value.replace(/\D/g,''),hi=$('#pHi').value.replace(/\D/g,'');
  if(!title){toast('请填写岗位名称');return} if(!lo||!hi){toast('请填写月薪范围');return}
  const fmt=n=>(+n).toLocaleString('en-US');
  const opts=[...document.querySelectorAll('#pOpt .chip.on')].map(c=>c.dataset.v);
  const data={title,en:role?.dataset.en||'',ind:$('#pInd .chip.on').dataset.v,exp:$('#pExp').value,sal:fmt(lo)+'–'+fmt(hi),city:$('#pCity .chip.on').textContent,
    n:+$('#pN').textContent,nats:[...document.querySelectorAll('#pNat .chip.on')].map(c=>c.dataset.v),zh:opts.includes('zh'),stay:opts.includes('stay'),desc:$('#pDesc').value};
  if(!data.nats.length)data.nats=['GH'];
  data.descEn=null;
  if(id){const j=S.jobs.find(j=>j.id===id);Object.assign(j,data);if(j.dbid)dbSafe(()=>DB.q('jobs?id=eq.'+j.dbid,{method:'PATCH',body:JSON.stringify(jobRow(j))}));toast('岗位已更新')}
  else{const j={id:Date.now(),apps:0,status:'open',owner:'me',company:MYCO,...data};S.jobs.unshift(j);toast('发布成功，已推送给匹配工人');
    dbSafe(async()=>{const r=await DB.q('rpc/post_job',{method:'POST',body:JSON.stringify({p_data:jobRow(j).data})});j.dbid=r;toast('已提交，平台审核通过后工人可见')})}
  S.jobFilter='all';tab('jobs');

  <div class="inputbar"><input id="mi" placeholder="输入中文，自动翻译…" onkeydown="if(event.key==='Enter')sendMsg()"><button class="icbtn dark" style="width:50px;height:50px" onclick="sendMsg()">${ic('send')}</button></div>`;
};
const REPLIES=[['OK boss, thank you. I will be there on time.','好的老板，谢谢，我会准时到。'],['Yes please, I can send my Ghana Card and certificate now.','好的，我现在可以发我的加纳身份证和证书。'],['Thank you sir, where exactly is the site?','谢谢先生，具体工地在哪里？'],['I am available. Please what time?','我有空，请问几点？']];
function sendMsg(k){
  const id=S.params.id;const c=S.chats.find(c=>c.wid===id);let o,t;
  if(k!==undefined){[o,t]=QUICK[k]}else{o=$('#mi').value.trim();if(!o)return;t='[EN] '+o}
  c.msgs.push({me:true,o,t,tm:nowT()});render(false);
  setTimeout(()=>{const r=pick(REPLIES);c.msgs.push({me:false,o:r[0],t:r[1],tm:nowT()});if(S.view==='chat'&&S.params.id===id){render(false)}else c.unread++},1300);
}

function inviteSheet(id){
  const w=W(id);const jobs=S.jobs.filter(j=>j.status==='open');const d=new Date();
  const days=[...Array(6)].map((_,k)=>{const x=new Date(d);x.setDate(d.getDate()+k+1);return x});
  const wk='日一二三四五六';
  openSheet(`<div class="row gap">${avatar(w)}<div><div class="b" style="font-size:18px">邀请 ${w.name} 面试</div><div class="sm muted">${w.role} · ${w.city}</div></div></div>
   <div class="fl" style="font-size:14px">面试岗位</div><div class="chips wrap" id="iJob">${(jobs.length?jobs:[{title:w.role}]).map((j,k)=>`<span class="chip sm ${k===0?'on':''}" onclick="pickOne(this)">${j.title}</span>`).join('')}</div>
   <div class="fl" style="font-size:14px">日期</div><div class="chips" id="iDate" style="margin:0 -20px">${days.map((x,k)=>`<span class="chip ${k===0?'on':''}" data-d="${x.getDate()}" data-m="${x.getMonth()+1}" style="flex-direction:column;gap:0;padding:8px 14px"><span class="xs">周${wk[x.getDay()]}</span><b>${x.getMonth()+1}/${x.getDate()}</b></span>`).join('')}</div>
   <div class="fl" style="font-size:14px">时间</div><div class="chips wrap" id="iTime">${['08:30','10:00','13:30','15:00'].map((t,k)=>`<span class="chip sm ${k===1?'on':''}" onclick="pickOne(this)">${t}</span>`).join('')}</div>
   <div class="fl" style="font-size:14px">方式</div><div class="chips wrap" id="iWay">${['到厂面试','视频面试','电话面试','直接试工'].map((t,k)=>`<span class="chip sm ${k===0?'on':''}" onclick="pickOne(this)">${t}</span>`).join('')}</div>
   <button class="bigbtn" style="width:100%;margin-top:22px" onclick="sendInvite(${id})">发送邀请（自动翻译为英文）</button>`);
  document.querySelectorAll('#iDate .chip').forEach(c=>c.onclick=()=>pickOne(c));
}
function sendInvite(id){
  const w=W(id);const job=$('#iJob .chip.on').textContent,dc=$('#iDate .chip.on'),time=$('#iTime .chip.on').textContent,way=$('#iWay .chip.on').textContent;
  const mo=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][dc.dataset.m-1];
  const wayEn={'到厂面试':'on-site interview','视频面试':'video interview','电话面试':'phone interview','直接试工':'trial work'}[way];
  S.interviews.unshift({wid:id,job,date:`${dc.dataset.m}月${dc.dataset.d}日`,d:dc.dataset.d,mo,time,way,place:w.city});
  let c=S.chats.find(c=>c.wid===id);if(!c){c={wid:id,unread:0,color:'#CFE36B',msgs:[]};S.chats.unshift(c)}
  c.msgs.push({me:true,o:`您好 ${w.name}，邀请您 ${dc.dataset.m}月${dc.dataset.d}日 ${time} 参加「${job}」岗位的${way}，请确认是否能来。`,t:`Hello ${w.name}, you are invited for a ${wayEn} for the ${job} position on ${mo} ${dc.dataset.d} at ${time}. Please confirm.`,tm:nowT()});
  closeSheet();toast('面试邀请已发送');
}

 if(!c.wid&&pool[0])c.wid=pool[0].id;const w=W(c.wid);const jobs=S.jobs.filter(j=>j.owner==='me');if(!c.jobId&&jobs[0])c.jobId=jobs[0].id;const j=S.jobs.find(x=>x.id===c.jobId);
 if(!c.sal&&w)c.sal=String(w.sal);if(!c.start){const d=new Date();d.setDate(d.getDate()+7);c.start=d.toISOString().slice(0,10)}

  }catch(e){if(manual)toast(t('upd_fail'))}
  finally{UPD.busy=false;if(S.view==='settings'||S.view==='w_me')render(false)}
}
function showUpd(v,kind){
  const force=!!v.force||kind==='apk'&&v.forceNative;
  openSheet(`<div class="row gap" style="align-items:center"><span style="width:52px;height:52px;border-radius:16px;background:var(--lime);display:grid;place-items:center;font-size:24px;font-weight:900">H</span>
   <div><div class="b" style="font-size:20px">${t('upd_title')}</div><div class="sm muted">v${APP_VER} → <b style="color:var(--ink)">v${esc(v.version)}</b>${v.date?' · '+esc(v.date):''}</div></div></div>
   ${updNotes(v)}
   ${kind==='apk'?`<div class="note-y" style="margin-top:14px">${t('upd_apk_tip')}</div>`:''}
   ${force?`<div class="xs" style="margin-top:10px;color:var(--red)">${t('upd_force')}</div>`:''}
   <div class="row gap" style="margin-top:18px">${force?'':`<button class="bigbtn" style="background:var(--card);color:#161616;flex:0 0 34%" onclick="updLater(${+v.build||0})">${t('upd_later')}</button>`}
   <button class="bigbtn" style="flex:1" onclick="${kind==='apk'?'doApk()':'doUpdate()'}">${kind==='apk'?t('upd_apk'):t('upd_now')}</button></div>`);
  $('#sheet').dataset.force=force?'1':'0'
}
function updLater(b){LS.set('updLater',{b,t:Date.now()});closeSheet()}
async function doUpdate(){
  LS.set('updFrom',APP_VER);persist&&persist();
  try{if('serviceWorker' in navigator){const rg=await navigator.serviceWorker.getRegistration();if(rg){await rg.update();if(rg.waiting)rg.waiting.postMessage('skip')}}
      if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}
  location.replace(location.pathname+'?v='+(UPD.remote?UPD.remote.build:Date.now()));
}
function doApk(){const u=(UPD.remote&&UPD.remote.apk)||'https://github.com/debaoqi/hiregh/releases/latest/download/HireGH.apk';
  if(isNative()){location.href=u}else window.open(u,'_blank')}
/* 强制更新时，关闭弹窗会再次弹出 */
const _open0=openSheet;openSheet=function(h){$('#sheet').dataset.force='0';return _open0(h)};
const _close0=closeSheet;closeSheet=function(){if($('#sheet').dataset.force==='1')return;return _close0()};
/* 更新完成后，告诉用户更新了什么（只显示一次） */
(function afterUpdate(){const from=LS.get('updFrom',null);const seen=LS.get('seenVer',null);LS.set('seenVer',APP_VER);
  if(!from||from===APP_VER)return;LS.set('updFrom',null);
  setTimeout(async()=>{let v=null;try{v=await (await fetch('/version.json?t='+Date.now(),{cache:'no-store'})).json()}catch(e){}
    openSheet(`<div class="b" style="font-size:20px">✓ ${t('upd_done')} v${APP_VER}</div>${v&&v.version===APP_VER?updNotes(v):''}<button class="bigbtn" style="width:100%;margin-top:18px" onclick="closeSheet()">${t('ok')}</button>`)},600)})();
/* 何时检查：启动后、回到前台、每 30 分钟 */
if(location.protocol==='https:'){
  setTimeout(()=>checkUpdate(false),2500);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate(false)});
  setInterval(()=>checkUpdate(false),30*60e3);
  try{window.Capacitor&&window.Capacitor.Plugins.App&&window.Capacitor.Plugins.App.addListener('resume',()=>checkUpdate(false))}catch(e){}
}
const hasUpd=()=>UPD.remote&&(+UPD.remote.build||0)>APP_BUILD;
const updRow=()=>`<div class="li" style="cursor:pointer" onclick="${hasUpd()?"showUpd(UPD.remote,'web')":'checkUpdate(true)'}">${ic('download')}<div style="flex:1"><div class="b" style="font-size:15px">${t('upd_check')}</div><div class="xs muted">v${APP_VER}${hasUpd()?` → <b style="color:var(--red)">v${esc(UPD.remote.version)}</b>`:''}</div></div>${hasUpd()?'<span style="width:9px;height:9px;border-radius:50%;background:var(--red)"></span>':'<span class="muted">›</span>'}</div>`;
P.download='<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>';
const _vset=V.settings;V.settings=()=>_vset().replace(/<div class="li"><div style="flex:1"><div class="b" style="font-size:15px">版本<\/div>.*?<\/div><\/div><\/div>/,'').replace('<div class="box"><div class="li" style="cursor:pointer" onclick="openSheet(','<div class="box">'+updRow()+'<div class="li" style="cursor:pointer" onclick="openSheet(');
const _vme2=V.w_me;V.w_me=()=>_vme2().replace(`<div class="li" style="cursor:pointer" onclick="toWelcome()">`,updRow()+`<div class="li" style="cursor:pointer" onclick="toWelcome()">`);

</script>
</body>
